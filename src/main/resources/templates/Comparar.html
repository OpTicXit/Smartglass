<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SmartGlass - Comparar Productos</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <style>
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 1rem 3rem; background: var(--bg-secondary); border-bottom: 1px solid var(--border-color); }
        .logo { color: var(--color-accent); font-weight: bold; font-size: 1.5rem; text-decoration: none; }
        .nav-links { display: flex; gap: 10px; }
        .nav-links a { color: var(--text-main); text-decoration: none; padding: 8px 16px; border-radius: 8px; background: var(--bg-tertiary); font-size: 0.9rem; }

        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .container h1 { color: var(--color-accent); }

        .comparador-grid { display: grid; gap: 20px; margin-top: 30px; }

        .col-especificacion { color: var(--text-muted); font-weight: bold; text-transform: uppercase; font-size: 0.8rem; padding: 14px 10px; }

        .producto-columna { background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 16px; overflow: hidden; }
        .producto-columna img { width: 100%; height: 180px; object-fit: cover; }
        .producto-columna .header { padding: 20px; text-align: center; border-bottom: 1px solid var(--border-color); }
        .producto-columna h3 { color: var(--text-main); margin: 0 0 8px; }
        .producto-columna .precio { color: var(--color-accent); font-size: 1.4rem; font-weight: bold; }

        .fila { display: grid; border-bottom: 1px solid var(--border-color); }
        .fila:last-child { border-bottom: none; }
        .fila-label { padding: 14px 20px; color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase; background: var(--bg-tertiary); }
        .fila-valor { padding: 14px 20px; color: var(--text-main); text-align: center; }

        .estrellas { color: var(--color-warning); }

        .btn-ver { display: block; text-align: center; padding: 12px; margin: 16px 20px 20px; background: var(--color-accent-dim); color: var(--color-accent); border: 1px solid var(--color-accent); border-radius: 8px; text-decoration: none; font-weight: bold; }
        .btn-ver:hover { background: var(--color-accent); color: var(--bg-primary); }

        @media (max-width: 900px) { .comparador-grid { overflow-x: auto; } }
    </style>
</head>
<body>

<nav class="navbar">
    <a th:href="@{${usuarioLogueado} ? '/usuario' : '/home'}" class="logo">◆ SmartGlass</a>
    <div class="nav-links">
        <a th:href="@{/catalogo}">&larr; Volver al catálogo</a>
    </div>
</nav>

<div class="container">
    <h1>Comparar productos</h1>
    <p style="color: var(--text-muted);">Viendo <span th:text="${#lists.size(items)}"></span> de 3 productos posibles.</p>

    <div class="comparador-grid" th:style="'grid-template-columns: repeat(' + ${#lists.size(items)} + ', 1fr);'">
        <div class="producto-columna" th:each="item : ${items}">
            <img th:src="${item.producto.imagen != null ? '/img/' + item.producto.imagen : '/img/default-glass.jpg'}"
                 th:alt="${item.producto.nombre}">
            <div class="header">
                <h3 th:text="${item.producto.nombre}"></h3>
                <div class="precio" th:text="'$' + ${item.producto.precioFormateado}"></div>
            </div>

            <div class="fila">
                <div class="fila-label">Calificación</div>
                <div class="fila-valor">
                    <span class="estrellas" th:text="${item.estrellasPromedio}"></span><br>
                    <span style="font-size: 0.8rem; color: var(--text-muted);"
                          th:text="${item.totalResenas} + ' reseña(s)'"></span>
                </div>
            </div>
            <div class="fila">
                <div class="fila-label">Tipo</div>
                <div class="fila-valor" th:text="${item.producto.tipo}"></div>
            </div>
            <div class="fila">
                <div class="fila-label">Ancho</div>
                <div class="fila-valor" th:text="${item.producto.ancho} + ' cm'"></div>
            </div>
            <div class="fila">
                <div class="fila-label">Alto</div>
                <div class="fila-valor" th:text="${item.producto.alto} + ' cm'"></div>
            </div>
            <div class="fila">
                <div class="fila-label">Espesor</div>
                <div class="fila-valor" th:text="${item.producto.espesor} + ' mm'"></div>
            </div>
            <div class="fila">
                <div class="fila-label">Código</div>
                <div class="fila-valor" th:text="${item.producto.codigo}"></div>
            </div>
            <div class="fila">
                <div class="fila-label">Descripción</div>
                <div class="fila-valor" style="text-align:left; font-size: 0.85rem; color: var(--text-muted);"
                     th:text="${item.producto.descripcion}"></div>
            </div>

            <a th:href="@{/detalle/{id}(id=${item.producto.id})}" class="btn-ver">Ver ficha completa</a>
        </div>
    </div>
</div>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
