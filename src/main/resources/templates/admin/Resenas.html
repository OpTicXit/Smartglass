<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SmartGlass - Reseñas (Admin)</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <style>
        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        table { width: 100%; border-collapse: collapse; background: var(--bg-secondary); border-radius: 12px; overflow: hidden; border: 1px solid var(--border-color); }
        th, td { text-align: left; padding: 12px 16px; border-bottom: 1px solid var(--border-color); }
        th { background: var(--bg-tertiary); color: var(--color-accent); font-size: 0.85rem; text-transform: uppercase; }
        td { color: var(--text-muted); }
        .estrellas { color: var(--color-warning); }
        .btn-eliminar { padding: 6px 12px; border-radius: 6px; background: transparent; border: 1px solid var(--color-error); color: var(--color-error); font-size: 0.8rem; }
        .flash { padding: 12px 16px; border-radius: 8px; margin: 20px 0; background: var(--color-success-dim); border: 1px solid var(--color-success); color: var(--color-success); }
    </style>
</head>
<body>

<div th:replace="~{admin/fragments/nav :: navbar}"></div>

<div class="container">
    <div th:replace="~{admin/fragments/nav :: volver(destino='/admin/dashboard', texto='Dashboard')}"></div>

    <h1 style="color: var(--text-main); margin-top: 20px;">Reseñas de productos</h1>

    <div class="flash" th:if="${mensaje}" th:text="${mensaje}"></div>

    <table>
        <thead><tr><th>Producto</th><th>Cliente</th><th>Calificación</th><th>Comentario</th><th></th></tr></thead>
        <tbody>
            <tr th:each="r : ${resenas}">
                <td><a th:href="@{/detalle/{id}(id=${r.productoId})}" style="color:var(--color-accent);">Ver producto</a></td>
                <td th:text="${r.nombreUsuario}"></td>
                <td class="estrellas" th:text="${r.estrellas}"></td>
                <td th:text="${r.comentario}"></td>
                <td>
                    <form th:action="@{/admin/resenas/{id}/eliminar(id=${r.id})}" method="post"
                          onsubmit="return confirm('¿Eliminar esta reseña?')">
                        <button type="submit" class="btn-eliminar">Eliminar</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>

    <div th:if="${#lists.isEmpty(resenas)}" style="color:var(--text-muted); padding: 30px 0;">
        Todavía no hay reseñas en el sistema.
    </div>
</div>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
