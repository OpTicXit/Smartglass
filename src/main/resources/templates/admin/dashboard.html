<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SmartGlass - Panel Admin</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">

    <style>
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 1rem 3rem; background: var(--bg-secondary); border-bottom: 1px solid var(--border-color); }
        .logo { color: var(--color-accent); font-weight: bold; font-size: 1.5rem; text-decoration: none; }
        .nav-links { display: flex; gap: 10px; }
        .nav-links a { color: var(--text-main); text-decoration: none; padding: 8px 16px; border-radius: 8px; background: var(--bg-tertiary); font-size: 0.9rem; }

        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin: 30px 0; }
        .stat-box { background: var(--bg-secondary); padding: 25px; border-radius: 12px; border: 1px solid var(--border-color); }
        .stat-box .value { font-size: 2rem; font-weight: bold; color: var(--color-accent); display: block; }
        .stat-box .label { color: var(--text-muted); font-size: 0.85rem; margin-top: 5px; }

        table { width: 100%; border-collapse: collapse; background: var(--bg-secondary); border-radius: 12px; overflow: hidden; border: 1px solid var(--border-color); }
        th, td { text-align: left; padding: 14px 16px; border-bottom: 1px solid var(--border-color); }
        th { background: var(--bg-tertiary); color: var(--color-accent); font-size: 0.85rem; text-transform: uppercase; }
        td { color: var(--text-muted); }
    </style>
</head>
<body>

<nav class="navbar">
    <a th:href="@{/admin/dashboard}" class="logo">◆ SmartGlass Admin</a>
    <div class="nav-links">
        <a th:href="@{/admin/usuarios}">Usuarios</a>
        <a th:href="@{/admin/pedidos}">Pedidos</a>
        <a th:href="@{/catalogo}">Ver tienda</a>
        <a th:href="@{/logout}" style="border:1px dashed var(--border-color); background:transparent;">Salir</a>
    </div>
</nav>

<div class="container">
    <h1 style="color: var(--text-main);">Panel de administración</h1>

    <div class="stats-grid">
        <div class="stat-box">
            <span class="value" th:text="'$ ' + ${#numbers.formatDecimal(stats.ingresos, 1, 'POINT', 0, 'COMMA')}"></span>
            <span class="label">Ingresos</span>
        </div>
        <div class="stat-box">
            <span class="value" th:text="${stats.co2Total} + ' kg'"></span>
            <span class="label">CO2 total</span>
        </div>
        <div class="stat-box">
            <span class="value" th:text="${stats.pendientes}"></span>
            <span class="label">Pedidos pendientes</span>
        </div>
        <div class="stat-box">
            <span class="value" th:text="${stats.totalPedidos}"></span>
            <span class="label">Total pedidos</span>
        </div>
    </div>

    <h3 style="color: var(--text-main);">Últimos pedidos</h3>
    <table>
        <thead><tr><th>Factura</th><th>Estado</th><th>Total</th></tr></thead>
        <tbody>
            <tr th:each="pedido : ${stats.pedidos}">
                <td th:text="${pedido.numeroFactura}"></td>
                <td th:text="${pedido.estado}"></td>
                <td th:text="${pedido.totalFormateado}"></td>
            </tr>
        </tbody>
    </table>
</div>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
