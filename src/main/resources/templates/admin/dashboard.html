<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SmartGlass - Panel Admin</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<div th:replace="~{admin/fragments/nav :: navbar}"></div>

<div class="container">
    <div th:replace="~{admin/fragments/nav :: volver(destino='/catalogo', texto='Volver a la tienda')}"></div>

    <h1 class="admin-title">Panel de administración</h1>

    <div class="stats-grid">
        <div class="stat-box card-panel">
            <span class="value" th:text="'$ ' + ${#numbers.formatDecimal(stats.ingresos, 1, 'POINT', 0, 'COMMA')}"></span>
            <span class="label">Ingresos</span>
        </div>
        <div class="stat-box card-panel">
            <span class="value" th:text="${stats.co2Total} + ' kg'"></span>
            <span class="label">CO2 total</span>
        </div>
        <div class="stat-box card-panel">
            <span class="value" th:text="${stats.pendientes}"></span>
            <span class="label">Pedidos pendientes</span>
        </div>
        <div class="stat-box card-panel">
            <span class="value" th:text="${stats.totalPedidos}"></span>
            <span class="label">Total pedidos</span>
        </div>
        <div class="stat-box card-panel">
            <span class="value" th:text="${totalUsuarios}"></span>
            <span class="label">Usuarios registrados</span>
        </div>
        <div class="stat-box card-panel">
            <span class="value" th:text="${totalProductos}"></span>
            <span class="label">Productos en catálogo</span>
        </div>
    </div>

    <h3 style="color: var(--text-main); margin-bottom: 16px;">Últimos pedidos</h3>
    <div class="table-wrap">
        <table class="table-admin">
            <thead><tr><th>Factura</th><th>Estado</th><th>Total</th></tr></thead>
            <tbody>
                <tr th:each="pedido : ${stats.pedidos}">
                    <td class="td-strong" th:text="${pedido.numeroFactura}"></td>
                    <td>
                        <span class="badge"
                              th:classappend="${pedido.estado == 'PENDIENTE'} ? 'badge-warning' : (${pedido.estado == 'PROCESANDO'} ? 'badge-info' : (${pedido.estado == 'ENVIADO'} ? 'badge-violet' : (${pedido.estado == 'ENTREGADO'} ? 'badge-success' : 'badge-error')))"
                              th:text="${pedido.estado}"></span>
                    </td>
                    <td th:text="${pedido.totalFormateado}"></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
