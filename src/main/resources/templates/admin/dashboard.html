<!DOCTYPE html>
<html lang="es" th:lang="${#locale.toLanguageTag()}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{admin.dashboard.smartglass_panel_admin}">SmartGlass - Panel Admin</title>
    <th:block th:replace="~{fragments/recursos :: recursos}"></th:block>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<!-- 1. Insertamos el Navbar dinámico -->
<nav th:replace="~{admin/fragments/nav :: navbar}"></nav>

<div class="container">
    
    <!-- Título principal -->
    <h1 class="admin-title" th:text="#{admin.dashboard.panel_de_administracion}">Panel de administración</h1>

    <!-- Alerta de éxito (si viene de cambiar un rol o estado) -->
    <div th:if="${mensaje}" class="flash" th:text="${mensaje}"></div>

    <!-- 2. Grid de KPIs (Estadísticas) -->
    <div class="stats-grid stats-6">
        <div class="stat-box card-panel">
            <span class="value" th:text="'$ ' + ${#numbers.formatDecimal(stats.ingresos, 1, 'COMMA', 0, 'POINT')}"></span>
            <span class="label" th:text="#{admin.dashboard.ingresos}">Ingresos</span>
        </div>
        <div class="stat-box card-panel">
            <span class="value" th:text="${stats.co2Total} + ' kg'"></span>
            <span class="label" th:text="#{admin.dashboard.co2_total}">CO₂ total</span>
        </div>
        <div class="stat-box card-panel">
            <span class="value" th:text="${stats.pendientes}"></span>
            <span class="label" th:text="#{admin.dashboard.pedidos_pendientes}">Pedidos pendientes</span>
        </div>
        <div class="stat-box card-panel">
            <span class="value" th:text="${stats.totalPedidos}"></span>
            <span class="label" th:text="#{admin.dashboard.total_pedidos}">Total pedidos</span>
        </div>
        <div class="stat-box card-panel">
            <span class="value" th:text="${totalUsuarios}"></span>
            <span class="label" th:text="#{admin.dashboard.usuarios_registrados}">Usuarios registrados</span>
        </div>
        <div class="stat-box card-panel">
            <span class="value" th:text="${totalProductos}"></span>
            <span class="label" th:text="#{admin.dashboard.productos_en_catalogo}">Productos en catálogo</span>
        </div>
    </div>

    <!-- 3. Tabla de Últimos Pedidos -->
    <h2 class="admin-subtitle" th:text="#{admin.dashboard.ultimos_pedidos}">Últimos pedidos</h2>
    <div class="table-wrap">
        <table class="table-admin">
            <thead>
                <tr>
                    <th th:text="#{admin.dashboard.factura}">Factura</th>
                    <th th:text="#{admin.dashboard.estado}">Estado</th>
                    <th th:text="#{admin.dashboard.total}">Total</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="pedido : ${stats.pedidos}">
                    <td class="td-strong" th:text="${pedido.numeroFactura}"></td>
                    <td>
                        <span class="badge"
                              th:classappend="${pedido.estado == 'PENDIENTE'} ? 'badge-warning' : 
                                              (${pedido.estado == 'PROCESANDO'} ? 'badge-info' : 
                                              (${pedido.estado == 'ENVIADO'} ? 'badge-violet' : 
                                              (${pedido.estado == 'ENTREGADO'} ? 'badge-success' : 'badge-error')))"
                              th:text="${pedido.estado}"></span>
                    </td>
                    <td th:text="${pedido.totalFormateado}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(stats.pedidos)}">
                    <td colspan="3" class="td-vacio" th:text="#{admin.dashboard.no_hay_pedidos_recientes}">No hay pedidos recientes.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
