<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SmartGlass - Panel Admin</title>
    <th:block th:replace="~{fragments/recursos :: recursos}"></th:block>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<!-- 1. Insertamos el Navbar dinámico -->
<nav th:replace="~{admin/fragments/nav :: navbar}"></nav>

<div class="container">
    
    <!-- Título principal -->
    <h1 class="admin-title">Panel de administración</h1>

    <!-- Alerta de éxito (si viene de cambiar un rol o estado) -->
    <div th:if="${mensaje}" class="flash" th:text="${mensaje}"></div>

    <!-- 2. Grid de KPIs (Estadísticas) -->
    <div class="stats-grid stats-6">
        <div class="stat-box card-panel">
            <span class="value" th:text="'$ ' + ${#numbers.formatDecimal(stats.ingresos, 1, 'COMMA', 0, 'POINT')}"></span>
            <span class="label">Ingresos</span>
        </div>
        <div class="stat-box card-panel">
            <span class="value" th:text="${stats.co2Total} + ' kg'"></span>
            <span class="label">CO₂ total</span>
        </div>
        <div class="stat-box card-panel">
            <span class="value" th:text="${stats.pendientes}"></span>
            <span class="label">Pedidos pendientes</span>
        </div>
        <div class="stat-box card-panel">
            <span class="value" th:text="${stats.totalPedidos}"></span>
            <span class="label">Total pedidos</span>
        </div>
        <div class="stat-box card-panel">
            <span class="value" th:text="${totalUsuarios}"></span>
            <span class="label">Usuarios registrados</span>
        </div>
        <div class="stat-box card-panel">
            <span class="value" th:text="${totalProductos}"></span>
            <span class="label">Productos en catálogo</span>
        </div>
    </div>

    <!-- 3. Tabla de Últimos Pedidos -->
    <h2 class="admin-subtitle">Últimos pedidos</h2>
    <div class="table-wrap">
        <table class="table-admin">
            <thead>
                <tr>
                    <th>Factura</th>
                    <th>Estado</th>
                    <th>Total</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="pedido : ${stats.pedidos}">
                    <td class="td-strong" th:text="${pedido.numeroFactura}"></td>
                    <td>
                        <span class="badge"
                              th:classappend="${pedido.estado == 'PENDIENTE'} ? 'badge-warning' : 
                                              (${pedido.estado == 'PROCESANDO'} ? 'badge-info' : 
                                              (${pedido.estado == 'ENVIADO'} ? 'badge-violet' : 
                                              (${pedido.estado == 'ENTREGADO'} ? 'badge-success' : 'badge-error')))"
                              th:text="${pedido.estado}"></span>
                    </td>
                    <td th:text="${pedido.totalFormateado}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(stats.pedidos)}">
                    <td colspan="3" class="td-vacio">No hay pedidos recientes.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
