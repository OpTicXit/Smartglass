<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
    Barra del panel de administracion.
    Estilos en theme.css ("NAVEGACION ORGANIZADA"); main.js marca la pestana activa
    y controla los menus. Un solo menu a la derecha reune el resto de acciones.
-->
<nav th:fragment="navbar"
     id="admin-navbar"
     class="navbar navbar--admin"
     data-nav="admin">

    <a th:href="@{/admin/dashboard}" class="logo">
        <img th:src="@{/img/logo-icono.png}" alt="">
        <span>SmartGlass</span>
        <span class="logo-tag">Admin</span>
    </a>

    <button type="button" class="nav-toggle" aria-label="Abrir menú de administración" aria-expanded="false" aria-controls="nav-panel-admin">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>

    <div class="nav-panel" id="nav-panel-admin">

        <ul class="nav-links">
            <li class="nav-item"><a class="nav-link" th:href="@{/admin/dashboard}" data-match="/admin/dashboard">Dashboard</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/admin/pedidos}" data-match="/admin/pedidos">Pedidos</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/admin/productos}" data-match="/admin/productos">Catálogo</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/admin/usuarios}" data-match="/admin/usuarios">Usuarios</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/admin/resenas}" data-match="/admin/resenas">Reseñas</a></li>
        </ul>

        <div class="nav-actions">
            <div class="nav-item has-menu nav-account">
                <button type="button" class="nav-link nav-trigger" aria-haspopup="true" aria-expanded="false">
                    <span class="nav-avatar" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
                    </span>
                    Administrador
                    <svg class="nav-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
                </button>
                <ul class="nav-dropdown nav-dropdown--right">
                    <li>
                        <a th:href="@{/home}">
                            Ver la tienda
                            <small>Cómo la ven tus clientes</small>
                        </a>
                    </li>
                    <li>
                        <a th:href="@{/usuario}">
                            Mi cuenta
                            <small>Tu perfil de comprador</small>
                        </a>
                    </li>
                    <li class="nav-sep" role="separator"></li>
                    <li>
                        <a class="is-danger" th:href="@{/logout}">Cerrar sesión</a>
                    </li>
                </ul>
            </div>
        </div>
    </div>

</nav>

</body>
</html>
