<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SmartGlass - Catálogo (Admin)</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <style>
        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }

        table { width: 100%; border-collapse: collapse; background: var(--bg-secondary); border-radius: 12px; overflow: hidden; border: 1px solid var(--border-color); margin-bottom: 40px; }
        th, td { text-align: left; padding: 12px 16px; border-bottom: 1px solid var(--border-color); vertical-align: middle; }
        th { background: var(--bg-tertiary); color: var(--color-accent); font-size: 0.85rem; text-transform: uppercase; }
        td { color: var(--text-muted); }
        td img { width: 48px; height: 48px; object-fit: cover; border-radius: 6px; background: var(--bg-tertiary); }
        .btn-eliminar { padding: 6px 12px; border-radius: 6px; background: transparent; border: 1px solid var(--color-error); color: var(--color-error); font-size: 0.8rem; }

        /* .card-form NO se convierte a card-panel a proposito: envuelve el
           formulario activo de "crear producto" -- mismo criterio que
           .checkout-form-section y el .card de usuario-detalle.html. */
        .card-form { background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 12px; padding: 30px; }
        .card-form h2 { color: var(--color-accent); margin-top: 0; }
        .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 16px; }
        .form-row label { display: block; margin-bottom: 6px; color: var(--text-muted); font-size: 0.85rem; }
        .form-row input, .form-row select, .form-row textarea { width: 100%; padding: 10px; border-radius: 8px; box-sizing: border-box; }
        .btn-crear { padding: 12px 28px; background: var(--color-accent); color: var(--bg-primary); border-radius: 8px; font-weight: bold; }
        .flash { padding: 12px 16px; border-radius: 8px; margin: 20px 0; background: var(--color-success-dim); border: 1px solid var(--color-success); color: var(--color-success); }
    </style>
</head>
<body>

<div th:replace="~{admin/fragments/nav :: navbar}"></div>

<div class="container">
    <div th:replace="~{admin/fragments/nav :: volver(destino='/admin/dashboard', texto='Dashboard')}"></div>

    <h1 style="color: var(--text-main); margin-top: 20px;">Catálogo de productos</h1>

    <div class="flash" th:if="${mensaje}" th:text="${mensaje}"></div>

    <table>
        <thead><tr><th></th><th>Nombre</th><th>Código</th><th>Tipo</th><th>Precio</th><th></th></tr></thead>
        <tbody>
            <tr th:each="p : ${productos}">
                <td><img th:src="@{/img/{img}(img=${p.imagen})}" th:alt="${p.nombre}"></td>
                <td style="color: var(--text-main);" th:text="${p.nombre}"></td>
                <td th:text="${p.codigo}"></td>
                <td th:text="${p.tipo}"></td>
                <td th:text="'$ ' + ${p.precioFormateado}"></td>
                <td>
                    <form th:action="@{/admin/productos/{id}/eliminar(id=${p.id})}" method="post"
                          onsubmit="return confirm('¿Eliminar este producto del catálogo?')">
                        <button type="submit" class="btn-eliminar">Eliminar</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>

    <div class="card-form">
        <h2>Agregar producto nuevo</h2>
        <form th:action="@{/admin/productos}" method="post">
            <div class="form-row">
                <div><label>Nombre</label><input type="text" name="nombre" required></div>
                <div><label>Código</label><input type="text" name="codigo" required></div>
                <div><label>Imagen (archivo en /img/)</label><input type="text" name="imagen" placeholder="vidrio21.jpg" required></div>
            </div>
            <div class="form-row">
                <div><label>Precio (COP)</label><input type="number" name="precio" step="1" required></div>
                <div>
                    <label>Tipo</label>
                    <select name="tipo">
                        <option value="crudo">Crudo</option>
                        <option value="templado">Templado</option>
                        <option value="laminado">Laminado</option>
                        <option value="insulado">Insulado</option>
                        <option value="decorativo">Decorativo</option>
                        <option value="espejo">Espejo</option>
                        <option value="inteligente">Inteligente</option>
                        <option value="control solar">Control solar</option>
                        <option value="solar">Solar</option>
                        <option value="tratado">Tratado</option>
                        <option value="curvo">Curvo</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div><label>Ancho (cm)</label><input type="number" step="0.1" name="ancho"></div>
                <div><label>Alto (cm)</label><input type="number" step="0.1" name="alto"></div>
                <div><label>Espesor (mm)</label><input type="number" step="0.1" name="espesor"></div>
            </div>
            <div class="form-row" style="grid-template-columns: 1fr;">
                <div><label>Descripción</label><textarea name="descripcion" rows="2"></textarea></div>
            </div>
            <button type="submit" class="btn-crear">Agregar al catálogo</button>
        </form>
    </div>
</div>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
