<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SmartGlass - Catálogo (Admin)</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<div th:replace="~{admin/fragments/nav :: navbar}"></div>

<div class="container">
    <div th:replace="~{admin/fragments/nav :: volver(destino='/admin/dashboard', texto='Dashboard')}"></div>

    <h1 class="admin-title">Catálogo de productos</h1>

    <div class="flash" th:if="${mensaje}" th:text="${mensaje}"></div>

    <div class="table-wrap" style="margin-bottom: 40px;">
        <table class="table-admin">
            <thead><tr><th></th><th>Nombre</th><th>Código</th><th>Tipo</th><th>Precio</th><th></th></tr></thead>
            <tbody>
                <tr th:each="p : ${productos}">
                    <td><img th:src="@{/img/{img}(img=${p.imagen})}" th:alt="${p.nombre}"></td>
                    <td class="td-strong" th:text="${p.nombre}"></td>
                    <td th:text="${p.codigo}"></td>
                    <td th:text="${p.tipo}"></td>
                    <td th:text="'$ ' + ${p.precioFormateado}"></td>
                    <td>
                        <form th:action="@{/admin/productos/{id}/eliminar(id=${p.id})}" method="post"
                              onsubmit="return confirm('¿Eliminar este producto del catálogo?')">
                            <button type="submit" class="btn-eliminar">Eliminar</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="card-form">
        <h2>Agregar producto nuevo</h2>
        <form th:action="@{/admin/productos}" method="post">
            <div class="form-row">
                <div><label>Nombre</label><input type="text" name="nombre" required></div>
                <div><label>Código</label><input type="text" name="codigo" required></div>
                <div><label>Imagen (archivo en /img/)</label><input type="text" name="imagen" placeholder="vidrio21.jpg" required></div>
            </div>
            <div class="form-row">
                <div><label>Precio (COP)</label><input type="number" name="precio" step="1" required></div>
                <div>
                    <label>Tipo</label>
                    <select name="tipo">
                        <option value="crudo">Crudo</option>
                        <option value="templado">Templado</option>
                        <option value="laminado">Laminado</option>
                        <option value="insulado">Insulado</option>
                        <option value="decorativo">Decorativo</option>
                        <option value="espejo">Espejo</option>
                        <option value="inteligente">Inteligente</option>
                        <option value="control solar">Control solar</option>
                        <option value="solar">Solar</option>
                        <option value="tratado">Tratado</option>
                        <option value="curvo">Curvo</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div><label>Ancho (cm)</label><input type="number" step="0.1" name="ancho"></div>
                <div><label>Alto (cm)</label><input type="number" step="0.1" name="alto"></div>
                <div><label>Espesor (mm)</label><input type="number" step="0.1" name="espesor"></div>
            </div>
            <div class="form-row" style="grid-template-columns: 1fr;">
                <div><label>Descripción</label><textarea name="descripcion" rows="2"></textarea></div>
            </div>
            <button type="submit" class="btn-crear">Agregar al catálogo</button>
        </form>
    </div>
</div>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
