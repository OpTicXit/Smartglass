<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SmartGlass - Usuarios</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<div th:replace="~{admin/fragments/nav :: navbar}"></div>

<div class="container container-narrow">
    <div th:replace="~{admin/fragments/nav :: volver(destino='/admin/dashboard', texto='Dashboard')}"></div>

    <h1 class="admin-title">Usuarios</h1>

    <div class="flash" th:if="${mensaje}" th:text="${mensaje}"></div>

    <div class="table-wrap">
        <table class="table-admin">
            <thead><tr><th>Nombre</th><th>Username</th><th>Email</th><th>Rol</th><th></th></tr></thead>
            <tbody>
                <tr th:each="u : ${usuarios}">
                    <td class="td-strong" th:text="${u.nombre}"></td>
                    <td th:text="${u.username}"></td>
                    <td th:text="${u.email}"></td>
                    <td>
                        <span class="badge"
                              th:classappend="${u.tipoUsuario == 'ROLE_ADMIN'} ? 'badge-violet' : 'badge-neutral'"
                              th:text="${u.tipoUsuario == 'ROLE_ADMIN'} ? 'Administrador' : 'Usuario'"></span>
                    </td>
                    <td><a class="ver" th:href="@{/admin/usuarios/{id}(id=${u.id})}">Ver / editar</a></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
