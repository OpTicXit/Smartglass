<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SmartGlass - Usuarios</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <style>
        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        table { width: 100%; border-collapse: collapse; background: var(--bg-secondary); border-radius: 12px; overflow: hidden; border: 1px solid var(--border-color); }
        th, td { text-align: left; padding: 14px 16px; border-bottom: 1px solid var(--border-color); }
        th { background: var(--bg-tertiary); color: var(--color-accent); font-size: 0.85rem; text-transform: uppercase; }
        td { color: var(--text-muted); }
        a.ver { color: var(--color-accent); text-decoration: none; font-weight: bold; }
        .flash { padding: 12px 16px; border-radius: 8px; margin: 20px 0; background: var(--color-success-dim); border: 1px solid var(--color-success); color: var(--color-success); }
    </style>
</head>
<body>

<div th:replace="~{admin/fragments/nav :: navbar}"></div>

<div class="container">
    <div th:replace="~{admin/fragments/nav :: volver(destino='/admin/dashboard', texto='Dashboard')}"></div>

    <h1 style="color: var(--text-main); margin-top: 20px;">Usuarios</h1>

    <div class="flash" th:if="${mensaje}" th:text="${mensaje}"></div>

    <table>
        <thead><tr><th>Nombre</th><th>Username</th><th>Email</th><th>Rol</th><th></th></tr></thead>
        <tbody>
            <tr th:each="u : ${usuarios}">
                <td style="color: var(--text-main);" th:text="${u.nombre}"></td>
                <td th:text="${u.username}"></td>
                <td th:text="${u.email}"></td>
                <td th:text="${u.tipoUsuario}"></td>
                <td><a class="ver" th:href="@{/admin/usuarios/{id}(id=${u.id})}">Ver / editar</a></td>
            </tr>
        </tbody>
    </table>
</div>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
