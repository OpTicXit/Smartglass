<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${usuario.nombre} + ' - Admin'">Usuario - Admin</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <style>
        .container { max-width: 500px; margin: 40px auto; padding: 0 20px; }
        /* .card NO se convierte a card-panel a proposito: contiene un
           formulario activo (cambiar rol) -- mismo criterio que
           .checkout-form-section en checkout.html. */
        .card { background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 12px; padding: 25px; }
        .row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border-color); }
        .row span:first-child { color: var(--text-muted); }
        .row span:last-child { color: var(--text-main); font-weight: 600; }
        .field { margin-top: 20px; }
        .field label { display: block; color: var(--text-muted); font-size: 0.85rem; margin-bottom: 8px; }
        .field select { width: 100%; padding: 10px; border-radius: 8px; }
        .btn-guardar { width: 100%; margin-top: 15px; padding: 12px; background: var(--color-accent); color: var(--bg-primary); border-radius: 8px; font-weight: bold; }
        .flash { padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; background: var(--color-success-dim); border: 1px solid var(--color-success); color: var(--color-success); }
    </style>
</head>
<body>

<div th:replace="~{admin/fragments/nav :: navbar}"></div>

<div class="container">
    <div th:replace="~{admin/fragments/nav :: volver(destino='/admin/usuarios', texto='Usuarios')}"></div>

    <div class="flash" th:if="${mensaje}" th:text="${mensaje}" style="margin-top: 20px;"></div>

    <div class="card" style="margin-top: 20px;">
        <h2 style="margin-top:0; color: var(--color-accent);" th:text="${usuario.nombre}"></h2>
        <div class="row"><span>Username</span><span th:text="${usuario.username}"></span></div>
        <div class="row"><span>Email</span><span th:text="${usuario.email}"></span></div>
        <div class="row"><span>Teléfono</span><span th:text="${usuario.telefono}"></span></div>
        <div class="row"><span>Rol actual</span><span th:text="${usuario.tipoUsuario}"></span></div>

        <form th:action="@{/admin/usuarios/{id}/rol(id=${usuario.id})}" method="post">
            <div class="field">
                <label for="tipoUsuario">Cambiar rol</label>
                <select id="tipoUsuario" name="tipoUsuario">
                    <option value="ROLE_USER" th:selected="${usuario.tipoUsuario == 'ROLE_USER'}">Usuario</option>
                    <option value="ROLE_ADMIN" th:selected="${usuario.tipoUsuario == 'ROLE_ADMIN'}">Administrador</option>
                </select>
            </div>
            <button type="submit" class="btn-guardar">Guardar rol</button>
        </form>
    </div>
</div>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
