<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${usuario.nombre} + ' - Admin'">Usuario - Admin</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<div th:replace="~{admin/fragments/nav :: navbar}"></div>

<div class="container container-sm">
    <div th:replace="~{admin/fragments/nav :: volver(destino='/admin/usuarios', texto='Usuarios')}"></div>

    <div class="flash" th:if="${mensaje}" th:text="${mensaje}" style="margin-top: 20px;"></div>

    <div class="card" style="margin-top: 20px;">
        <h2 th:text="${usuario.nombre}"></h2>
        <div class="row"><span>Username</span><span th:text="${usuario.username}"></span></div>
        <div class="row"><span>Email</span><span th:text="${usuario.email}"></span></div>
        <div class="row"><span>Teléfono</span><span th:text="${usuario.telefono}"></span></div>
        <div class="row">
            <span>Rol actual</span>
            <span class="badge"
                  th:classappend="${usuario.tipoUsuario == 'ROLE_ADMIN'} ? 'badge-violet' : 'badge-neutral'"
                  th:text="${usuario.tipoUsuario == 'ROLE_ADMIN'} ? 'Administrador' : 'Usuario'"></span>
        </div>

        <form th:action="@{/admin/usuarios/{id}/rol(id=${usuario.id})}" method="post">
            <div class="field">
                <label for="tipoUsuario">Cambiar rol</label>
                <select id="tipoUsuario" name="tipoUsuario">
                    <option value="ROLE_USER" th:selected="${usuario.tipoUsuario == 'ROLE_USER'}">Usuario</option>
                    <option value="ROLE_ADMIN" th:selected="${usuario.tipoUsuario == 'ROLE_ADMIN'}">Administrador</option>
                </select>
            </div>
            <button type="submit" class="btn-guardar">Guardar rol</button>
        </form>
    </div>
</div>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
