<!DOCTYPE html>
<html lang="es" th:lang="${#locale.toLanguageTag()}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{admin.usuario_detalle.titulo_pagina(${usuario.nombre})}">Usuario - Admin</title>
    <th:block th:replace="~{fragments/recursos :: recursos}"></th:block>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<!-- Navbar del Admin -->
<div th:replace="~{admin/fragments/nav :: navbar}"></div>

<div class="container container-sm">
    
<!-- Alerta flash (cuando se cambia el rol) -->
    <div class="flash mt-3" th:if="${mensaje}" th:text="${mensaje}"></div>

    <!-- Ficha del usuario -->
    <div class="card mt-3">
        <h2 th:text="${usuario.nombre}"></h2>
        
        <div class="row">
            <span th:text="#{admin.usuario-detalle.username}">Username</span>
            <span th:text="${usuario.username}"></span>
        </div>
        
        <div class="row">
            <span th:text="#{admin.usuario-detalle.email}">Email</span>
            <span th:text="${usuario.email}"></span>
        </div>
        
        <div class="row">
            <span th:text="#{admin.usuario-detalle.telefono}">Teléfono</span>
            <span th:text="${usuario.telefono}"></span>
        </div>
        
        <div class="row">
            <span th:text="#{admin.usuario-detalle.rol_actual}">Rol actual</span>
            <span class="badge"
                  th:classappend="${usuario.tipoUsuario == 'ROLE_ADMIN'} ? 'badge-violet' : 'badge-neutral'"
                  th:text="${usuario.tipoUsuario == 'ROLE_ADMIN'} ? #{admin.rol.admin} : #{admin.rol.usuario}"></span>
        </div>

        <!-- Formulario para cambiar el rol -->
        <form th:action="@{/admin/usuarios/{id}/rol(id=${usuario.id})}" method="post">
            <div class="field">
                <label for="tipoUsuario" th:text="#{admin.usuario-detalle.cambiar_rol}">Cambiar rol</label>
                <select id="tipoUsuario" name="tipoUsuario">
                    <option value="ROLE_USER" th:selected="${usuario.tipoUsuario == 'ROLE_USER'}" th:text="#{admin.usuario-detalle.usuario}">Usuario</option>
                    <option value="ROLE_ADMIN" th:selected="${usuario.tipoUsuario == 'ROLE_ADMIN'}" th:text="#{admin.usuario-detalle.administrador}">Administrador</option>
                </select>
            </div>
            <button type="submit" class="btn-guardar" th:text="#{admin.usuario-detalle.guardar_rol}">Guardar rol</button>
        </form>
    </div>
</div>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
