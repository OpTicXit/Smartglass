<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SmartGlass - Pedidos (Admin)</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <style>
        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        table { width: 100%; border-collapse: collapse; background: var(--bg-secondary); border-radius: 12px; overflow: hidden; border: 1px solid var(--border-color); }
        th, td { text-align: left; padding: 14px 16px; border-bottom: 1px solid var(--border-color); }
        th { background: var(--bg-tertiary); color: var(--color-accent); font-size: 0.85rem; text-transform: uppercase; }
        td { color: var(--text-muted); }
        .estado-form { display: flex; gap: 8px; }
        .estado-form select { padding: 6px 8px; border-radius: 6px; font-size: 0.85rem; }
        .estado-form button { padding: 6px 12px; border-radius: 6px; background: var(--color-accent); color: var(--bg-primary); font-weight: bold; font-size: 0.8rem; }
        .flash { padding: 12px 16px; border-radius: 8px; margin: 20px 0; background: var(--color-success-dim); border: 1px solid var(--color-success); color: var(--color-success); }
    </style>
</head>
<body>

<div th:replace="~{admin/fragments/nav :: navbar}"></div>

<div class="container">
    <div th:replace="~{admin/fragments/nav :: volver(destino='/admin/dashboard', texto='Dashboard')}"></div>

    <h1 style="color: var(--text-main); margin-top: 20px;">Pedidos</h1>

    <div class="flash" th:if="${mensaje}" th:text="${mensaje}"></div>

    <table>
        <thead><tr><th>Factura</th><th>Cliente</th><th>Fecha</th><th>Estado</th><th>Total</th><th>Cambiar estado</th></tr></thead>
        <tbody>
            <tr th:each="pedido : ${pedidos}">
                <td th:text="${pedido.numeroFactura}"></td>
                <td th:text="${pedido.usuario != null ? pedido.usuario.nombre : '—'}"></td>
                <td th:text="${#temporals.format(pedido.fechaPedido, 'dd/MM/yyyy')}"></td>
                <td th:text="${pedido.estado}"></td>
                <td th:text="${pedido.totalFormateado}"></td>
                <td>
                    <form class="estado-form" th:action="@{/admin/pedidos/{id}/estado(id=${pedido.id})}" method="post">
                        <select name="estado">
                            <option value="PENDIENTE" th:selected="${pedido.estado == 'PENDIENTE'}">Pendiente</option>
                            <option value="PROCESANDO" th:selected="${pedido.estado == 'PROCESANDO'}">Procesando</option>
                            <option value="ENVIADO" th:selected="${pedido.estado == 'ENVIADO'}">Enviado</option>
                            <option value="ENTREGADO" th:selected="${pedido.estado == 'ENTREGADO'}">Entregado</option>
                            <option value="CANCELADO" th:selected="${pedido.estado == 'CANCELADO'}">Cancelado</option>
                        </select>
                        <button type="submit">Guardar</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</div>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
