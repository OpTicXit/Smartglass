<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SmartGlass - Cotizar Vidrio a Medida</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">

    <style>
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 1rem 3rem; background: var(--bg-secondary); border-bottom: 1px solid var(--border-color); }
        .logo { color: var(--color-accent); font-weight: bold; font-size: 1.5rem; text-decoration: none; }

        .form-container { max-width: 700px; margin: 40px auto; padding: 30px; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 16px; }
        .form-container h1 { color: var(--color-accent); margin-top: 0; }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: var(--text-muted); font-size: 0.9rem; }
        .form-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .form-row.dos { grid-template-columns: 1fr 1fr; }

        .checkbox-row { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
        .checkbox-row input { width: auto; }

        .btn-submit { width: 100%; padding: 15px; background: var(--color-accent); color: var(--text-on-accent); border-radius: 8px; font-weight: bold; font-size: 1.05rem; margin-top: 10px; }
    </style>
</head>
<body>

<nav class="navbar">
    <a th:href="@{/usuario}" class="logo">◆ SmartGlass</a>
    <a th:href="@{/vidrio-personalizado/mis-cotizaciones}" style="color:var(--text-main); text-decoration:none;">← Mis cotizaciones</a>
</nav>

<div class="form-container">
    <h1>Diseña tu vidrio a medida</h1>
    <p style="color: var(--text-muted);">
        NOTA: esta es una version minima temporal -- el archivo original
        "vidrio-personalizado-form.html" no llego con contenido, avisame
        cuando lo tengas y lo reemplazo manteniendo esta misma logica de envio.
    </p>

    <form th:action="@{/vidrio-personalizado/cotizar}" method="post">
        <div class="form-group">
            <label>Tipo de vidrio</label>
            <input type="text" name="tipoVidrio" th:value="${param.tipo}" required>
        </div>

        <div class="form-row">
            <div class="form-group"><label>Ancho (cm)</label><input type="number" step="0.1" name="ancho" required></div>
            <div class="form-group"><label>Alto (cm)</label><input type="number" step="0.1" name="alto" required></div>
            <div class="form-group"><label>Espesor (mm)</label><input type="number" step="0.1" name="espesor" required></div>
        </div>

        <div class="form-row dos">
            <div class="form-group">
                <label>Tratamiento</label>
                <select name="tratamiento">
                    <option value="templado">Templado</option>
                    <option value="laminado">Laminado</option>
                    <option value="insulado">Insulado</option>
                    <option value="">Ninguno</option>
                </select>
            </div>
            <div class="form-group">
                <label>Forma</label>
                <input type="text" name="forma" placeholder="Rectangular, curvo...">
            </div>
        </div>

        <div class="form-row dos">
            <div class="form-group"><label>Color</label><input type="text" name="color"></div>
            <div class="form-group"><label>Cantidad de capas</label><input type="number" name="cantidadCapas" value="1" min="1"></div>
        </div>

        <div class="form-group">
            <label>Notas adicionales</label>
            <textarea name="notasAdicionales" rows="3"></textarea>
        </div>

        <div class="checkbox-row">
            <input type="checkbox" id="requiereCorteEspecial" name="requiereCorteEspecial" value="true">
            <label for="requiereCorteEspecial" style="margin:0;">Requiere corte especial</label>
        </div>
        <div class="checkbox-row">
            <input type="checkbox" id="usarVidrioReciclado" name="usarVidrioReciclado" value="true">
            <label for="usarVidrioReciclado" style="margin:0;">Usar vidrio reciclado</label>
        </div>
        <div class="form-group" style="max-width: 200px;">
            <label>% material reciclado</label>
            <input type="number" name="porcentajeReciclado" value="0" min="0" max="100">
        </div>
        <div class="checkbox-row">
            <input type="checkbox" id="energiaRenovable" name="energiaRenovable" value="true">
            <label for="energiaRenovable" style="margin:0;">Fabricar con energía renovable</label>
        </div>
        <div class="checkbox-row">
            <input type="checkbox" id="compensarCarbono" name="compensarCarbono" value="true">
            <label for="compensarCarbono" style="margin:0;">Compensar huella de carbono</label>
        </div>

        <button type="submit" class="btn-submit">Generar cotización</button>
    </form>
</div>

</body>
</html>
