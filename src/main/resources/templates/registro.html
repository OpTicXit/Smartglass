<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SmartGlass - Registro</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="icon" type="image/png" th:href="@{/img/logo-icono.png}">

    <style>
        /* =========================================================
           SMARTGLASS — REGISTRO
           Diseño contextual: creación de cuenta
           ========================================================= */

        .login-page {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 32px 20px;
            box-sizing: border-box;
            overflow: hidden;
        }

        /* Decoración ambiental */
        .login-page::before,
        .login-page::after {
            content: "";
            position: fixed;
            width: 340px;
            height: 340px;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0.08;
            filter: blur(4px);
        }

        .login-page::before {
            top: -150px;
            left: -120px;
            border: 1px solid var(--color-accent);
            box-shadow:
                0 0 0 45px var(--color-accent),
                0 0 0 90px transparent;
        }

        .login-page::after {
            right: -150px;
            bottom: -170px;
            background: var(--color-accent);
        }

        /* Panel principal (.card-panel para theme.css/main.js) */
        .login-container.card-panel-registro {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 470px;
            padding: 42px;
            box-sizing: border-box;
            text-align: left;
            overflow: hidden;
        }

        /* Línea superior de identidad */
        .login-container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: var(--color-accent);
        }

        /* Cabecera */
        .register-header {
            margin-bottom: 30px;
            text-align: center;
        }

        .brand-logo-link {
            display: inline-block;
            margin-bottom: 20px;
            text-decoration: none;
        }

        .register-logo-full {
            max-width: 220px;
            height: auto;
            display: block;
            margin: 0 auto;
            transition: transform 0.25s ease;
        }

        .register-logo-full:hover {
            transform: scale(1.03);
        }

        .login-container h2 {
            margin: 0 0 8px;
            color: var(--color-accent);
            font-size: clamp(1.8rem, 4vw, 2.2rem);
            line-height: 1.15;
            letter-spacing: -0.03em;
            text-align: left;
        }

        .register-description {
            margin: 0;
            color: var(--text-muted);
            font-size: 0.92rem;
            line-height: 1.6;
            text-align: left;
        }

        /* Formulario */
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 17px;
        }

        .form-field {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .form-field label {
            color: var(--text-muted);
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .login-form input {
            width: 100%;
            min-height: 48px;
            box-sizing: border-box;
            padding: 12px 14px;
            border: 1px solid var(--text-muted);
            border-radius: 10px;
            outline: none;
            background: transparent;
            color: inherit;
            font: inherit;
            transition:
                border-color 0.25s ease,
                box-shadow 0.25s ease,
                transform 0.25s ease;
        }

        .login-form input::placeholder {
            color: var(--text-muted);
            opacity: 0.75;
        }

        .login-form input:hover {
            border-color: var(--color-accent);
        }

        .login-form input:focus {
            border-color: var(--color-accent);
            box-shadow: 0 0 0 3px var(--color-accent);
            transform: translateY(-1px);
        }

        /* Separador visual antes de la acción */
        .form-action {
            position: relative;
            margin-top: 8px;
            padding-top: 8px;
        }

        .form-action::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 48px;
            height: 1px;
            background: var(--color-accent);
        }

        .btn-submit {
            width: 100%;
            border: 0;
            background: var(--color-accent);
            color: var(--text-on-accent);
            padding: 13px 18px;
            min-height: 50px;
            font-size: 0.95rem;
            font-weight: 800;
            letter-spacing: 0.02em;
            border-radius: 10px;
            cursor: pointer;
            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease;
        }

        .btn-submit:hover {
            background: var(--color-accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px var(--color-accent);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        /* Mensaje de error */
        .alert-error {
            display: flex;
            align-items: flex-start;
            gap: 9px;
            color: var(--color-error);
            background: var(--color-error-dim);
            border: 1px solid var(--color-error);
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 0.87rem;
            font-weight: 600;
            line-height: 1.45;
            margin-top: 2px;
        }

        /* Navegación inferior */
        .links-container {
            position: relative;
            margin-top: 12px;
            padding-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            border-top: 1px solid var(--text-muted);
        }

        .links-container a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.82rem;
            line-height: 1.4;
            transition:
                color 0.25s ease,
                transform 0.25s ease;
        }

        .links-container a:hover {
            color: var(--color-accent);
            transform: translateX(2px);
        }

        .links-container a:first-child {
            color: var(--color-accent);
            font-weight: 700;
        }

        /* Pie contextual */
        .register-footer {
            margin-top: 24px;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.72rem;
            letter-spacing: 0.04em;
            opacity: 0.8;
        }

        /* Responsive */
        @media (max-width: 560px) {
            .login-page {
                padding: 20px 14px;
            }

            .login-container.card-panel-registro {
                padding: 32px 24px;
            }

            .links-container {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }

            .links-container a:hover {
                transform: none;
            }
        }

        @media (max-width: 380px) {
            .login-container.card-panel-registro {
                padding: 28px 18px;
            }

            .login-container h2 {
                font-size: 1.7rem;
            }

            .register-logo-full {
                max-width: 180px;
            }
        }

        /* Respeto por usuarios que reducen movimiento */
        @media (prefers-reduced-motion: reduce) {
            .login-form input,
            .btn-submit,
            .links-container a,
            .register-logo-full {
                transition: none;
            }
        }
    </style>
</head>

<body>

<div class="login-page">
    <div class="login-container card-panel card-panel-registro">

        <div class="register-header">
            <a th:href="@{/home}" class="brand-logo-link" title="Volver al inicio">
                <img th:src="@{/img/logo-full.png}" src="/img/logo-full.png" alt="SmartGlass" class="register-logo-full">
            </a>

            <h2>Crear Cuenta</h2>

            <p class="register-description">
                Completa tus datos para crear tu cuenta y comenzar a utilizar SmartGlass.
            </p>
        </div>

        <form class="login-form" th:action="@{/registro}" method="POST">

            <div class="form-field">
                <label for="nombre">Nombre completo</label>
                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    placeholder="Nombre completo"
                    required>
            </div>

            <div class="form-field">
                <label for="email">Correo electrónico</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Correo electrónico"
                    required>
            </div>

            <div class="form-field">
                <label for="telefono">Teléfono</label>
                <input
                    type="tel"
                    id="telefono"
                    name="telefono"
                    placeholder="Teléfono"
                    required>
            </div>

            <div class="form-field">
                <label for="username">Usuario</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Usuario (Login)"
                    required>
            </div>

            <div class="form-field">
                <label for="password">Contraseña</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Contraseña"
                    required>
            </div>

            <div class="form-action">
                <button type="submit" class="btn-submit">Registrarse</button>
            </div>

            <div th:if="${error}" class="alert-error">
                ❌ <span th:text="${error}">El usuario o correo ya existe</span>
            </div>

            <div class="links-container">
                <a th:href="@{/login}" style="color: var(--color-accent); font-weight: bold;">← Volver al login</a>
                <a th:href="@{/home}">← Ir al inicio</a>
            </div>

        </form>

        <div class="register-footer">
            Registro seguro · SmartGlass
        </div>

    </div>
</div>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
