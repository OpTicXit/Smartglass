<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SmartGlass - Mis Pedidos</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    
    <style>
        /* CORRECCIÓN DEL NAVBAR (Esquina superior izquierda) */
        .navbar { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 1rem 3rem; 
            background: var(--bg-secondary); 
            border-bottom: 1px solid var(--border-color); 
        }
        .logo { 
            color: var(--color-accent); 
            font-weight: bold; 
            font-size: 1.5rem; 
            text-decoration: none; 
        }
        .nav-links { 
            display: flex; 
            list-style: none; 
            gap: 15px; 
            margin: 0; 
            padding: 0; 
        }
        .nav-links a { 
            color: var(--text-main); 
            text-decoration: none; 
            padding: 8px 16px; 
            border-radius: 8px; 
            background: var(--bg-tertiary); 
            transition: 0.3s; 
            font-size: 0.9rem;
        }
        .nav-links a:hover { 
            background: var(--color-accent); 
            color: var(--bg-primary); 
        }

        /* Estructura del Contenido */
        .pedidos-container { max-width: 1200px; margin: 40px auto; padding: 20px; }
        .page-header h1 { font-size: 2.5em; color: var(--color-accent); margin-bottom: 10px; }
        
        .estadisticas-pedidos { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-pedido { display: flex; gap: 15px; align-items: center; padding: 20px; background: var(--bg-secondary); border-radius: 12px; border: 1px solid var(--border-color); }
        .stat-pedido strong { font-size: 1.8em; color: var(--text-main); display: block; }
        .stat-pedido span { color: var(--text-muted); font-size: 0.9em; }

        .pedido-card { background: var(--bg-secondary); border-radius: 12px; border: 1px solid var(--border-color); overflow: hidden; margin-bottom: 25px; transition: 0.3s; }
        .pedido-card:hover { border-color: var(--color-accent); }
        
        .pedido-header { display: flex; justify-content: space-between; align-items: center; padding: 20px; background: var(--bg-tertiary); border-bottom: 1px solid var(--border-color); }
        .pedido-estado { padding: 5px 15px; border-radius: 20px; font-weight: bold; font-size: 0.8em; text-transform: uppercase; }
        .estado-pendiente { background: rgba(250, 179, 135, 0.1); color: var(--color-warning); border: 1px solid var(--color-warning); }
        .estado-completado { background: rgba(166, 227, 161, 0.1); color: var(--color-success); border: 1px solid var(--color-success); }

        .pedido-productos { padding: 20px; }
        .producto-item { display: flex; align-items: center; gap: 15px; padding: 10px; background: var(--bg-tertiary); border-radius: 8px; margin-bottom: 10px; border: 1px solid var(--border-color); }
        .producto-item img { width: 50px; height: 50px; border-radius: 4px; object-fit: cover; }

        .pedido-footer { display: flex; justify-content: space-between; align-items: center; padding: 20px; background: var(--bg-tertiary); border-top: 1px solid var(--border-color); }
        .total-badge { padding: 10px 20px; background: var(--color-accent-dim); color: var(--color-accent); border: 1px solid var(--color-accent); border-radius: 8px; font-weight: bold; }
        
        .btn-factura { padding: 10px 20px; background: var(--color-info); color: white; text-decoration: none; border-radius: 8px; font-weight: bold; transition: 0.3s; border: none; cursor: pointer; }
        .btn-factura:hover { filter: brightness(1.1); }
    </style>
</head>
<body>

<nav class="navbar">
    <a th:href="@{/usuario}" class="logo">◆ SmartGlass</a>
    <ul class="nav-links">
        <li><a th:href="@{/Tienda}">Tienda</a></li>
        <li><a th:href="@{/carrito}">🛒 Carrito</a></li>
        <li><a th:href="@{/vidrio-personalizado/mis-cotizaciones}">Mis Cotizaciones</a></li>
        <li><a th:href="@{/logout}" style="border:1px dashed var(--border-color); background:transparent;">Salir</a></li>
    </ul>
</nav>

<div class="pedidos-container">
    <div class="page-header">
        <h1>📦 Mis Pedidos</h1>
        <p style="color: var(--text-muted);">Gestiona y revisa el historial de tus adquisiciones técnicas.</p>
    </div>

    <div class="estadisticas-pedidos" th:if="${not #lists.isEmpty(pedidos)}">
        <div class="stat-pedido">
            <div style="font-size: 2em;">📊</div>
            <div>
                <strong th:text="${#lists.size(pedidos)}">0</strong>
                <span>Total Realizados</span>
            </div>
        </div>
        <div class="stat-pedido">
            <div style="font-size: 2em;">🌱</div>
            <div>
                <strong>Sostenible</strong>
                <span>Huella compensada</span>
            </div>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(pedidos)}" style="text-align: center; padding: 80px 20px;">
        <h2 style="color: var(--text-muted);">No has realizado pedidos todavía.</h2>
        <a th:href="@{/Tienda}" class="btn-factura" style="display: inline-block; margin-top: 20px; background: var(--color-accent); color: var(--bg-primary);">Explorar Catálogo</a>
    </div>

    <div th:unless="${#lists.isEmpty(pedidos)}" class="pedidos-lista">
        <div class="pedido-card" th:each="pedido : ${pedidos}">
            <div class="pedido-header">
                <div>
                    <h3 style="margin: 0; color: var(--text-main);">Pedido #<span th:text="${pedido.id}"></span></h3>
                    <span style="font-size: 0.85em; color: var(--text-muted);" th:text="${#temporals.format(pedido.fechaPedido, 'dd/MM/yyyy HH:mm')}"></span>
                </div>
                <div th:class="'pedido-estado estado-' + ${#strings.toLowerCase(pedido.estado)}" th:text="${pedido.estado}">ESTADO</div>
            </div>

            <div class="pedido-productos">
                <div class="producto-item" th:each="detalle : ${pedido.detalles}">
                    <img th:src="@{/img/{img}(img=${detalle.imagenProducto})}" alt="Producto">
                    <div style="flex: 1;">
                        <strong th:text="${detalle.nombreProducto}" style="color: var(--text-main);"></strong>
                        <div style="font-size: 0.85em; color: var(--text-muted);" th:text="${detalle.cantidad} + ' unidades'"></div>
                    </div>
                    <div style="color: var(--color-accent); font-weight: bold;" th:text="${detalle.subtotalFormateado}"></div>
                </div>
            </div>

            <div class="pedido-footer">
                <div class="total-badge">Total: <span th:text="${pedido.totalFormateado}"></span></div>
                <a th:href="@{/checkout/pedido/{id}(id=${pedido.id})}" class="btn-factura">📄 Ver Factura</a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
