<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SmartGlass - Checkout</title>
    <link rel="stylesheet" href="/css/theme.css">
    
    <style>
        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 1rem 3rem; background: var(--bg-secondary); border-bottom: 1px solid var(--border-color);
        }
        .logo { color: var(--color-accent); font-weight: bold; font-size: 1.5rem; text-decoration: none; }
        
        .checkout-container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .checkout-container h1 { color: var(--color-accent); margin-bottom: 30px; }

        /* BREADCRUMB */
        .breadcrumb { display: flex; gap: 10px; margin-bottom: 30px; padding: 15px; background: var(--bg-secondary); border-radius: 8px; font-size: 0.9rem; }
        .breadcrumb-item.current { color: var(--color-accent); font-weight: bold; }
        .breadcrumb-item { color: var(--text-muted); }

        /* GRID PRINCIPAL */
        .checkout-grid { display: grid; grid-template-columns: 1fr 380px; gap: 30px; }

        /* SECCIONES Y FORMULARIOS */
        .checkout-form-section { background: var(--bg-secondary); border-radius: 12px; border: 1px solid var(--border-color); padding: 30px; margin-bottom: 25px; }
        .checkout-form-section h2 { font-size: 1.3rem; margin-bottom: 20px; color: var(--text-main); border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: var(--text-muted); font-size: 0.9rem; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

        /* MÉTODOS DE PAGO */
        .metodos-pago { display: grid; gap: 12px; }
        .metodo-card { border: 2px solid var(--border-color); border-radius: 8px; padding: 15px; cursor: pointer; display: flex; align-items: center; gap: 15px; transition: 0.3s; }
        .metodo-card:hover { border-color: var(--color-accent); }
        .metodo-card input { display: none; }
        .metodo-card.selected { border-color: var(--color-accent); background: var(--color-accent-dim); }

        /* SECCIÓN ECO */
        .eco-banner { background: var(--color-accent-dim); border: 1px solid var(--color-accent); border-radius: 8px; padding: 20px; margin-top: 10px; }
        .huella-valor { color: var(--color-error); font-weight: bold; font-size: 1.2rem; }
        
        /* RESUMEN STICKY */
        .resumen-sticky { position: sticky; top: 100px; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 12px; padding: 25px; }
        .resumen-item { display: flex; gap: 15px; padding: 15px 0; border-bottom: 1px solid var(--border-color); }
        .resumen-item img { width: 50px; height: 50px; object-fit: cover; border-radius: 6px; }
        .total-final { display: flex; justify-content: space-between; padding: 15px; background: var(--color-accent); color: var(--text-on-accent); border-radius: 8px; font-weight: bold; font-size: 1.2rem; margin-top: 20px; }

        .btn-finalizar { width: 100%; padding: 15px; background: var(--color-success); color: var(--bg-primary); border-radius: 8px; font-weight: bold; font-size: 1.1rem; margin-top: 20px; }

        @media (max-width: 900px) { .checkout-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<nav class="navbar">
    <a href="/home" class="logo">◆ SmartGlass</a>
    <div class="nav-links">
        <a href="/catalogo" style="background:transparent; color:var(--text-main)">Volver a Tienda</a>
    </div>
</nav>

<div class="checkout-container">
    <div class="breadcrumb">
        <span class="breadcrumb-item">🛒 Carrito</span> <span>→</span>
        <span class="breadcrumb-item current">📦 Checkout</span> <span>→</span>
        <span class="breadcrumb-item">✓ Confirmación</span>
    </div>

    <h1>🛍️ Finalizar Compra</h1>

    <div class="checkout-grid">
        <div class="checkout-main">
            <form th:action="@{/checkout/procesar}" method="post" id="formCheckout">
                <section class="checkout-form-section">
                    <h2>📍 Datos de Entrega</h2>
                    <div class="form-group">
                        <label>Dirección Completa *</label>
                        <textarea name="direccionEnvio" rows="2" required placeholder="Ej: Calle 123 #45-67..."></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label>Ciudad</label><input type="text" name="ciudad" required></div>
                        <div class="form-group"><label>Teléfono</label><input type="tel" name="telefono" required></div>
                    </div>
                </section>

                <section class="checkout-form-section">
                    <h2>💳 Método de Pago</h2>
                    <div class="metodos-pago">
                        <label class="metodo-card selected">
                            <input type="radio" name="metodoPago" value="TARJETA_CREDITO" checked>
                            <span>💳 Tarjeta de Crédito / Débito</span>
                        </label>
                        <label class="metodo-card">
                            <input type="radio" name="metodoPago" value="PSE">
                            <span>🏦 PSE / Transferencia</span>
                        </label>
                    </div>
                </section>

                <section class="checkout-form-section">
                    <h2>🌱 Compensación CO₂</h2>
                    <div class="eco-banner">
                        <p>Tu pedido genera <span class="huella-valor" th:text="${huellaCarbono} + ' kg CO₂'">0 kg</span></p>
                        <label style="display:flex; align-items:center; gap:10px; cursor:pointer;">
                            <input type="checkbox" name="compensarCarbono" value="true" style="width:20px; height:20px;">
                            <strong>Deseo compensar mi huella (+$5.000)</strong>
                        </label>
                    </div>
                </section>

                <button type="submit" class="btn-finalizar">Confirmar y Pagar</button>
            </form>
        </div>

        <aside class="resumen-pedido">
            <div class="resumen-sticky">
                <h3 style="margin-top:0;">📦 Resumen</h3>
                <div th:each="item : ${items}" class="resumen-item">
                    <img th:src="@{/img/{img}(img=${item.producto.imagen})}">
                    <div>
                        <div th:text="${item.producto.nombre}" style="font-weight:bold; font-size:0.9rem;"></div>
                        <div th:text="'Cant: ' + ${item.cantidad}" style="color:var(--text-muted); font-size:0.8rem;"></div>
                    </div>
                </div>
                <div class="total-final">
                    <span>Total</span>
                    <span th:text="'$' + ${total}">$0</span>
                </div>
            </div>
        </aside>
    </div>
</div>

<script>
    // Lógica para resaltar el método de pago seleccionado
    document.querySelectorAll('.metodo-card').forEach(card => {
        card.addEventListener('click', () => {
            document.querySelectorAll('.metodo-card').forEach(c => c.classList.remove('selected'));
            card.classList.add('selected');
        });
    });
</script>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
