<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SmartGlass - Carrito de Compras</title>
    <link rel="stylesheet" href="/css/theme.css">
    
    <style>
        /* === NAVBAR SIMPLE === */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 3rem;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
        }
        .logo { color: var(--color-accent); font-weight: bold; font-size: 1.5rem; }
        .nav-links { display: flex; gap: 1rem; }
        .nav-links a { color: var(--text-main); text-decoration: none; padding: 8px 16px; border-radius: 8px; background: var(--bg-tertiary); }
        .nav-links a:hover { background: var(--border-color); }

        /* === CONTENEDOR CARRITO === */
        .carrito-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
        }
        .carrito-container h1 {
            color: var(--color-accent);
            margin-bottom: 30px;
        }

        /* === ESTADO VACÍO === */
        /* fondo/borde/radio ahora los da .card-panel (inyectada en el HTML) */
        .carrito-vacio {
            text-align: center;
            padding: 80px 20px;
        }
        .carrito-vacio h2 { color: var(--text-main); }
        .carrito-vacio p { color: var(--text-muted); margin-bottom: 20px; }

        /* === LISTA DE ITEMS (GRID) === */
        .items-lista {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }
        /* fondo/borde/radio ahora los da .card-panel; aqui solo el grid */
        .item-carrito {
            display: grid;
            grid-template-columns: 100px 1fr auto auto auto;
            gap: 20px;
            align-items: center;
            padding: 20px;
        }
        .item-imagen img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
        }
        .item-info h3 { margin: 0 0 5px 0; color: var(--text-main); }
        .item-info p { margin: 0; color: var(--text-muted); font-size: 0.9em; }
        
        .item-cantidad { display: flex; flex-direction: column; gap: 5px; align-items: center;}
        .item-cantidad input { width: 60px; text-align: center; padding: 8px; }
        .btn-actualizar { padding: 6px 12px; background: var(--color-info); color: var(--text-on-accent); border-radius: 6px; font-size: 0.8em; }

        .item-precio { text-align: right; }
        .item-precio .label { display: block; font-size: 0.85em; color: var(--text-muted); }
        .item-precio .precio-total { font-size: 1.3em; font-weight: bold; color: var(--color-accent); }

        .btn-eliminar { background: var(--color-error); color: var(--bg-primary); padding: 10px 15px; border-radius: 8px; font-weight: bold; }

        /* === RESUMEN Y BOTONES === */
        /* fondo/borde/radio ahora los da .card-panel */
        .carrito-resumen {
            padding: 30px;
        }
        .carrito-total {
            display: flex;
            justify-content: space-between;
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }
        .carrito-total .total-monto { color: var(--color-success); }

        .carrito-acciones {
            display: flex;
            justify-content: flex-end;
            gap: 15px;
            flex-wrap: wrap;
        }
        .btn { padding: 12px 24px; border-radius: 8px; font-weight: bold; text-decoration: none; cursor: pointer;}
        .btn-danger { background: transparent; color: var(--color-error); border: 1px solid var(--color-error); }
        .btn-secondary { background: var(--bg-tertiary); color: var(--text-main); border: 1px solid var(--border-color); }
        .btn-primary { background: var(--color-success); color: var(--bg-primary); }
        
        /* Alertas */
        .alert { padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: center; font-weight: bold;}
        /* rgba(166,227,161,0.1) = --color-success con 10% de opacidad, mismo
           patron que --color-accent-dim pero para success -- theme.css no
           trae un token para eso, se deja como excepcion documentada en vez
           de inventar una variable nueva por fuera del estandar global. */
        .alert-success { background: rgba(166, 227, 161, 0.1); border: 1px solid var(--color-success); color: var(--color-success); }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="logo">◆ SmartGlass</div>
    <ul class="nav-links">
        <a href="/catalogo">Tienda</a>
        <a href="/checkout/mis-pedidos">Mis Pedidos</a>
    </ul>
</nav>

<div class="carrito-container">
    <h1>🛒 Mi Carrito de Compras</h1>

    <div th:if="${mensaje}" th:class="'alert alert-' + ${tipoMensaje}">
        <span th:text="${mensaje}"></span>
    </div>

    <div th:if="${#lists.isEmpty(items)}" class="carrito-vacio card-panel">
        <h2>Tu carrito está vacío</h2>
        <p>Explora nuestro catálogo y encuentra los mejores productos.</p>
        <a href="/catalogo" class="btn btn-primary">Ir a la Tienda</a>
    </div>

    <div th:unless="${#lists.isEmpty(items)}">
        <div class="items-lista">
            <div th:each="item : ${items}" class="item-carrito card-panel">
                
                <div class="item-imagen">
                    <img th:src="@{/img/{img}(img=${item.producto.imagen})}" th:alt="${item.producto.nombre}">
                </div>

                <div class="item-info">
                    <h3 th:text="${item.producto.nombre}"></h3>
                    <p th:text="'Código: ' + ${item.producto.codigo}"></p>
                    <p th:text="'Unitario: $' + ${item.producto.precioFormateado}"></p>
                </div>

                <div class="item-cantidad">
                    <form th:action="@{/carrito/actualizar}" method="post">
                        <input type="hidden" name="productoId" th:value="${item.producto.id}">
                        <input type="number" name="cantidad" th:value="${item.cantidad}" min="1" max="99">
                        <button type="submit" class="btn-actualizar">Actualizar</button>
                    </form>
                </div>

                <div class="item-precio">
                    <span class="label">Subtotal:</span>
                    <span class="precio-total" th:text="'$' + ${item.subtotalFormateado}"></span>
                </div>

                <div class="item-eliminar">
                    <form th:action="@{/carrito/eliminar/{id}(id=${item.producto.id})}" method="post" onsubmit="return confirmarEliminacion(event)">
                        <button type="submit" class="btn-eliminar">🗑️ Eliminar</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="carrito-resumen card-panel">
            <div class="carrito-total">
                <span>Total a pagar:</span>
                <span class="total-monto" th:text="'$ ' + ${#numbers.formatDecimal(total, 0, 'POINT', 0, 'COMMA')}"></span>
            </div>

            <div class="carrito-acciones">
                <form th:action="@{/carrito/limpiar}" method="post" onsubmit="return confirmarVaciarCarrito(event)">
                    <button type="submit" class="btn btn-danger">Vaciar Carrito</button>
                </form>
                <a href="/catalogo" class="btn btn-secondary">Seguir Comprando</a>
                <form th:action="@{/carrito/procesar-compra}" method="post">
                    <button type="submit" class="btn btn-primary">✓ Finalizar Compra</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    function confirmarEliminacion(event) {
        if(!confirm('¿Estás seguro de que deseas eliminar este producto del carrito?')) {
            event.preventDefault();
            return false;
        }
        return true;
    }

    function confirmarVaciarCarrito(event) {
        if(!confirm('¿Estás seguro de vaciar todo tu carrito? Esta acción no se puede deshacer.')) {
            event.preventDefault();
            return false;
        }
        return true;
    }
</script>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
