<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SmartGlass - Panel de Usuario</title>
    <link rel="stylesheet" href="/css/theme.css">
    
    <style>
        /* Navbar */
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 1rem 3rem; background: var(--bg-secondary); border-bottom: 1px solid var(--border-color); }
        .logo { color: var(--color-accent); font-weight: bold; font-size: 1.5rem; text-decoration: none; }
        .nav-links { display: flex; gap: 10px; flex-wrap: wrap;}
        .nav-links a { color: var(--text-main); text-decoration: none; padding: 8px 16px; border-radius: 8px; background: var(--bg-tertiary); font-size: 0.9rem; transition: 0.3s;}
        .nav-links a:hover { background: var(--color-accent); color: var(--bg-primary); }

        /* Panel Hero */
        .usuario-hero { text-align: center; padding: 60px 20px; background: var(--bg-tertiary); margin-bottom: 40px; border-bottom: 1px solid var(--border-color); }
        .usuario-hero h2 { font-size: 2.8rem; margin: 0 0 10px 0; color: var(--text-main); }
        .usuario-hero span { color: var(--color-accent); }
        .usuario-hero p { color: var(--text-muted); font-size: 1.1rem; }

        /* Sección Catálogo Dashboard */
        .catalogo-container { max-width: 1300px; margin: 0 auto; padding: 0 20px 60px; }
        .catalogo-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; }
        .catalogo-header h3 { font-size: 1.5rem; color: var(--text-main); margin: 0; }
        .link-ver-mas { color: var(--color-accent); text-decoration: none; font-weight: bold; }

        /* Grid igual a Tienda */
        .productos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 25px; }

        /* .producto-card: fondo, borde, sombra, hover y luz de cursor ya
           los da theme.css (regla global compartida) -- aqui solo va lo
           que es propio de ESTA vista: texto centrado y separacion inferior. */
        .producto-card { text-align: center; padding-bottom: 20px; }

        .producto-img-container { position: relative; width: 100%; height: 200px; overflow: hidden; margin-bottom: 15px; }
        .producto-img-container img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
        .producto-card:hover .producto-img-container img { filter: brightness(0.5); transform: scale(1.05); }

        .ver-mas-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); opacity: 0; transition: 0.3s; }
        .producto-card:hover .ver-mas-overlay { opacity: 1; }
        .btn-view { padding: 10px 20px; background: var(--color-accent); color: var(--bg-primary); border-radius: 8px; text-decoration: none; font-weight: bold; }

        .producto-card h4 { color: var(--text-main); margin: 0 0 5px 0; font-size: 1.1rem; padding: 0 15px; }
        .detalle { color: var(--text-muted); font-size: 0.85rem; padding: 0 15px; margin-bottom: 15px; }
        .precio-badge { color: var(--color-accent); font-weight: bold; font-size: 1.3rem; }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="logo">◆ SmartGlass</div>
    <ul class="nav-links">
        <a href="/catalogo">Tienda</a>
        <a href="/destacados">Destacados</a>
        <a href="/carrito" style="background:var(--color-accent-dim); color:var(--color-accent); border:1px solid var(--color-accent);">🛒 (<span th:text="${cantidadCarrito}">0</span>)</a>
        <a href="/checkout/mis-pedidos">Mis Pedidos</a>
        <a href="/vidrio-personalizado/mis-cotizaciones">Mis Cotizaciones</a>
        <a href="/logout" style="border: 1px dashed var(--border-color); background:transparent;">Salir</a>
    </ul>
</nav>

<section class="usuario-hero">
    <h2>Bienvenido, <span th:text="${usuario.nombre}">Usuario</span></h2>
    <p>Explora nuestros productos y gestiona tu panel de proyectos a medida.</p>
</section>

<section class="catalogo-container">
    <div class="catalogo-header">
        <h3>🔥 Novedades y Destacados</h3>
        <a href="/destacados" class="link-ver-mas">Ver todos →</a>
    </div>
    
    <div class="productos-grid">
        <div class="producto-card" th:each="producto, iterStat : ${destacados}" th:if="${iterStat.index < 8}">
            <div class="producto-img-container">
                <img th:src="@{/img/{img}(img=${producto.imagen})}" th:alt="${producto.nombre}">
                <div class="ver-mas-overlay">
                    <a th:href="@{/detalle/{id}(id=${producto.id})}" class="btn-view">Detalles</a>
                </div>
            </div>
            <h4 th:text="${producto.nombre}">Vidrio</h4>
            <p class="detalle" th:text="${producto.descripcionCorta}">Desc</p>
            <div class="precio-badge" th:text="'$' + ${producto.precioFormateado}">$0</div>
        </div>
    </div>
</section>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
