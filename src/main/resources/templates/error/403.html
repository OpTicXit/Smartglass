<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Acceso denegado - SmartGlass</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <style>
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 1rem 3rem; background: var(--bg-secondary); border-bottom: 1px solid var(--border-color); }
        .logo { color: var(--color-accent); font-weight: bold; font-size: 1.5rem; text-decoration: none; }
        .wrap { max-width: 500px; margin: 100px auto; text-align: center; }
        .btn { display: inline-block; margin-top: 20px; padding: 12px 24px; background: var(--color-accent); color: var(--text-on-accent); border-radius: 8px; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<nav class="navbar">
    <a th:href="@{/home}" class="logo">◆ SmartGlass</a>
</nav>

<div class="wrap">
    <h1 style="color: var(--text-main);">No tienes acceso a esta página</h1>
    <p style="color: var(--text-muted);">Si crees que esto es un error, contacta a un administrador.</p>
    <a th:href="@{/catalogo}" class="btn">Volver al catálogo</a>
</div>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
