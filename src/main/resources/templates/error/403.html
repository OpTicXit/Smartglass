<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <script th:src="@{/js/theme-init.js}"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso denegado - SmartGlass</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="icon" type="image/png" th:href="@{/img/logo-icono.png}">
    <style>
        .navbar .logo img { height: 32px; width: auto; }
        .navbar .logo span { color: var(--color-accent); }

        .acceso-denegado {
            position: relative;
            display: grid;
            place-content: center;
            justify-items: center;
            min-height: calc(100vh - 140px);
            max-width: 560px;
            margin: 0 auto;
            padding: 40px 24px;
            text-align: center;
        }

        .acceso-denegado::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            width: 520px;
            height: 520px;
            max-width: 100%;
            transform: translate(-50%, -55%);
            background: radial-gradient(circle, var(--color-accent-dim) 0%, transparent 65%);
            pointer-events: none;
        }

        .acceso-denegado > * { position: relative; }

        .acceso-denegado .codigo {
            margin: 0 0 6px;
            font-size: clamp(5.5rem, 20vw, 9rem);
            font-weight: 800;
            line-height: 1;
            letter-spacing: -0.06em;
            background: linear-gradient(180deg, var(--color-accent) 0%, color-mix(in srgb, var(--color-accent) 22%, transparent) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            max-width: none;
        }

        .acceso-denegado h1 { margin: 0 0 12px; font-size: clamp(1.4rem, 4vw, 1.9rem); }
        .acceso-denegado p { margin: 0; color: var(--text-muted); max-width: 440px; }

        .acciones { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 28px; }
    </style>
</head>
<body>

<nav class="navbar">
    <a th:href="@{/home}" class="logo">
        <img th:src="@{/img/logo-icono.png}" alt="SmartGlass">
        <span>SmartGlass</span>
    </a>
</nav>

<main class="acceso-denegado">
    <p class="codigo" aria-hidden="true">403</p>
    <h1>No tienes acceso a esta página</h1>
    <p>Tu cuenta no tiene permisos para ver este contenido. Si crees que es un error, contacta a un administrador.</p>

    <div class="acciones">
        <a th:href="@{/catalogo}" class="btn btn-primary">Volver al catálogo</a>
        <a th:href="@{/home}" class="btn btn-secondary">Ir al inicio</a>
    </div>
</main>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
