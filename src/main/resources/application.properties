spring.application.name=smartglass
# T6: Render y Railway asignan el puerto en PORT; en local sigue siendo 50500
server.port=${PORT:50500}

# Configuración MySQL (Usuarios y Transacciones)
# T6: en produccion MYSQL_URL trae el host, la base y el SSL del proveedor gestionado
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/smartglass_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${MYSQL_USER:root}
# H01: sin valor por defecto; se lee de la variable de entorno MYSQL_PASSWORD
spring.datasource.password=${MYSQL_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
# U2: imprimir cada consulta frenaba cada pagina en desarrollo; para depurar: SHOW_SQL=true
spring.jpa.show-sql=${SHOW_SQL:false}

# Configuración MongoDB (Catálogo y Carrito)
# T6 / AUD-12: Spring Boot 4 ignora spring.data.mongodb.uri (obsoleta con nivel error desde 4.0),
# por eso la app usaba su valor por defecto, mongodb://localhost/test. La propiedad correcta es
# spring.mongodb.uri. En local se mantiene la base "test", que es donde estan hoy los datos;
# en produccion MONGODB_URI (Atlas) debe nombrar su base, p. ej. .../smartglass?retryWrites=true
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/test}


# Configuración de Seguridad JWT
# H01: sin valor por defecto; variable de entorno JWT_SECRET (minimo 32 caracteres, HMAC-SHA256)
smartglass.jwt.secret=${JWT_SECRET}
smartglass.jwt.expiration-ms=86400000

# H01: contrasena del admin inicial (solo se usa si el admin aun no existe en MySQL)
smartglass.admin.password=${ADMIN_PASSWORD:}

# Datos de demostracion (DemoDatosSeeder): solo con DEMO_DATOS=true y una sola vez.
# DEMO_PASSWORD (opcional) es la contrasena de los clientes de ejemplo; sin ella nadie puede entrar con ellos.
smartglass.demo.datos=${DEMO_DATOS:false}
smartglass.demo.password=${DEMO_PASSWORD:}

# --- SEGURIDAD DE COOKIES Gestión de sesiones ---
server.servlet.session.cookie.name=SMARTGLASS_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=Lax
server.servlet.session.cookie.secure=false

# --- TIEMPOS DE SESIÓN ---
server.servlet.session.timeout=15m
server.servlet.session.cookie.max-age=900

# --- CONTROL DE ERRORES ---
server.error.include-message=always
server.error.whitelabel.enabled=false

# Trazas de seguridad: DEBUG escribia decenas de lineas por peticion (tambien por cada CSS, JS e imagen)
# y se notaba al navegar. Para depurar el login: LOG_SEGURIDAD=DEBUG
logging.level.org.springframework.security=${LOG_SEGURIDAD:INFO}
logging.level.org.springframework.security.oauth2=${LOG_SEGURIDAD:INFO}

# ===============================
# CONFIGURACIÓN OAUTH2 (GOOGLE LOGIN)
# ===============================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email
# T6: la URL de vuelta sale del dominio con el que se entra (en local: http://localhost:50500/...).
# En produccion hay que registrar https://<dominio>/login/oauth2/code/google en Google Cloud.
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# T6: carpeta de fotos subidas desde el admin. En Render/Railway debe ser un volumen persistente
# (el disco del contenedor se borra en cada despliegue); ver DESPLIEGUE.md
smartglass.uploads.dir=${UPLOADS_DIR:uploads}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# =========================================================
# RONDA SEGURIDAD / RENDIMIENTO (F35, F41, F42)
# =========================================================
# F35: crea los indices declarados (@Indexed unique en Carrito.usuarioId, @CompoundIndex en VidrioSostenible).
# Si ya hay carritos duplicados por usuario, la creacion del indice unico falla: limpiarlos antes.
spring.data.mongodb.auto-index-creation=true

# F42: ajuste de servidor y pool
server.compression.enabled=true
# U2: los estaticos los sirve EstaticosWebConfig (css, js, vendor) y UploadsWebConfig (img), sin el "/**" de Boot
spring.web.resources.add-mappings=false
server.tomcat.threads.max=200
server.tomcat.max-connections=8192
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=3000

# F41: limites por minuto del RateLimitFilter (por usuario o por IP)
smartglass.ratelimit.anonimo-por-minuto=30
smartglass.ratelimit.usuario-por-minuto=120
smartglass.ratelimit.admin-por-minuto=300
smartglass.ratelimit.sensible-por-minuto=10
# H05: intentos de login (POST /login y POST /auth/login) por IP y minuto
smartglass.ratelimit.login-por-minuto=10
# Poner en true SOLO si la app corre detras de un proxy propio que sobrescribe X-Forwarded-For
smartglass.ratelimit.confiar-forwarded-for=false
