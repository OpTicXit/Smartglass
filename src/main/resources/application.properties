spring.application.name=smartglass


# Configuración MySQL (Usuarios y Transacciones)
spring.datasource.url=jdbc:mysql://localhost:3306/smartglass_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Configuración MongoDB (Catálogo y Carrito)
spring.data.mongodb.uri=mongodb://localhost:27017/smartglass_catalog

# Configuración de Seguridad JWT
smartglass.jwt.secret=ClaveSecretaSuperSeguraParaSmartGlass2026ConSuficientesBitsParaHMACSHA256
smartglass.jwt.expiration-ms=86400000