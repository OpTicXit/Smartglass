# --- T5 SaaS (planes, funciones y consola de superadmin) ---
funcion.FORMAS_AVANZADAS.titulo=Advanced shapes
funcion.FORMAS_AVANZADAS.desc=9 extra shapes: rounded corners, capsule, arch, right triangle, raked, gable, diamond, hexagon and octagon.
funcion.FORMAS_AVANZADAS.porque=A small shop mostly sells rectangular and round pieces; facade and decorative shapes belong to higher-volume workshops.
funcion.CORTE_PERSONALIZADO.titulo=Custom cut (drawing editor)
funcion.CORTE_PERSONALIZADO.desc=Customers draw their piece, up to 64 vertices, and pay for the actual area.
funcion.CORTE_PERSONALIZADO.porque=In the market, design and production outputs sit in mid and high tiers; a less structured shop quotes special pieces by hand.
funcion.COMPROMISOS_VERDES.titulo=Green commitments and seal
funcion.COMPROMISOS_VERDES.desc=Take-back, reusable packaging, consolidated delivery, offcuts and the Green commitment seal, with its summary in the panel.
funcion.COMPROMISOS_VERDES.porque=It requires logistics (routes, rack returns, offcut inventory) that only an organised operation can deliver.
funcion.FICHA_AMBIENTAL.titulo=Printable environmental sheet
funcion.FICHA_AMBIENTAL.desc=A document per piece with composition, footprint and choices, for projects or sustainable building certifications.
funcion.FICHA_AMBIENTAL.porque=Architects and builders ask for it; walk-in customers rarely need it.
funcion.OFERTAS_PROGRAMADAS.titulo=Scheduled offers
funcion.OFERTAS_PROGRAMADAS.desc=Offer prices with start and end dates, announced to customers in the bell.
funcion.OFERTAS_PROGRAMADAS.porque=Marketing tools sit in the market’s top tiers; on Basic you manage stock only.
funcion.CIFRAS_PUBLICAS.titulo=Live public figures
funcion.CIFRAS_PUBLICAS.desc=Real platform counters on the home and About pages.
funcion.CIFRAS_PUBLICAS.porque=With few sales the numbers are small; show them once the business has volume.
funcion.MULTI_IDIOMA.titulo=Multiple languages
funcion.MULTI_IDIOMA.desc=English and Spanish (Spain), besides Colombian Spanish.
funcion.MULTI_IDIOMA.porque=A neighbourhood shop serves in one language; several languages serve exports, tourism or foreign customers.
plan.solo_avanzado=Available on the Advanced plan.
