acerca3.estado_t=Project status
acerca3.estado_sub=A working prototype, ready for a pilot phase.
acerca3.estado_d=SmartGlass already lets you design, quote, approve, pay and track orders. It is ready for a pilot: no glass shop runs it yet.
acerca3.estado_1_t=What already works
acerca3.estado_1_d=Store, configurator with 3D view, cut editor, quotes approved by the workshop, payment, invoice, tracking and admin panel.
acerca3.estado_2_t=What comes next
acerca3.estado_2_d=A pilot with a glass shop, validating the estimates with real data and setting plan prices from its results.
acerca3.estado_3_t=How to read the CO₂
acerca3.estado_3_d=It is an estimate based on published average factors, useful to compare options before manufacturing. It is not a measurement or a certification.
acerca3.faq_t=Frequently asked questions
acerca3.faq_sub=What people ask us most before designing a piece.
acerca3.faq_p1_q=Is the CO₂ you show a measurement?
acerca3.faq_p1_a=No. It is an estimate based on published average factors (Colombian power grid, PVB interlayer, road transport). It helps you compare options before manufacturing.
acerca3.faq_p2_q=Do I need an account to design or get a quote?
acerca3.faq_p2_a=No. You can browse the store, design your piece and see its price and CO₂ without an account. We only ask for one at checkout.
acerca3.faq_p3_q=How is my quote approved?
acerca3.faq_p3_a=The workshop reviews it in its panel and approves or rejects it. You get a notification and, once approved, the piece moves to your cart.
acerca3.faq_p4_q=Which payment methods do you accept?
acerca3.faq_p4_a=Credit card and PSE. At checkout you can also offset the estimated CO₂ of your order.
acerca3.faq_p5_q=What is the recommended configuration?
acerca3.faq_p5_a=If your piece has a high impact, we suggest changes (recycled glass, renewable energy or a thickness suited to its use) and show you side by side what changes. You decide whether to apply it.
acerca3.faq_p6_q=Can I draw a shape that is not on the list?
acerca3.faq_p6_a=Yes. In the cut editor you draw the outline by hand, adjust its points, and the real area goes into the price and the CO₂.
acerca3.faq_p7_q=Which languages and aids does it support?
acerca3.faq_p7_a=Colombian Spanish, Spain Spanish and English, with a color-blind mode, a no-animation mode and a guided tour of about one minute.
