# Informe tecnico: origen de cada dato, como leerlo y "¿Que estoy viendo?" (nov. 2026)
admin.informe.leer_t=How to read this report
admin.informe.leer_intro=Each block has a tag next to its title that says where its data comes from, and a "What am I looking at?" that explains what it shows and how to read it. SmartGlass CO₂ is always estimated with emission factors; it is not measured.
admin.informe.o_plataforma=Platform
admin.informe.o_plataforma_d=What is stored in SmartGlass: quotes, orders and revenue.
admin.informe.o_estimado=Estimated
admin.informe.o_estimado_d=CO₂ the quote tool calculates for each piece with emission factors. It is not a measurement.
admin.informe.o_sintetico=Synthetic
admin.informe.o_sintetico_d=Data generated from published emission factors: the 10,000-piece dataset and the simulated history.
admin.informe.o_modelo=Model
admin.informe.o_modelo_d=What the Random Forest trained on the synthetic dataset predicts. It is not used in the quote tool yet.
admin.informe.o_externo=External context
admin.informe.o_externo_d=Public data from other sources (Our World in Data). It is not SmartGlass or glass data.
admin.informe.c_azul=Blue: platform data and what the model predicts.
admin.informe.c_ambar=Amber: the value it is compared with (the CO₂ calculated in the dataset) and the projection. On the globe, the countries that emit the most.
admin.informe.c_linea=Dashed line and band: the projection and its likely range.
admin.informe.c_alerta=No chart color is an alert. Alerts in the panel are text tags, such as "Pending" or "Cancelled".
admin.informe.qv=What am I looking at?
admin.informe.qv_muestra=What it shows
admin.informe.qv_origen=Where it comes from
admin.informe.qv_leer=How to read it
admin.informe.qv_colombia= Colombia emitted {0} Mt that year, {1} % of the world total.
admin.informe.n_nota=(n=…) = few pieces of that type in the dataset: the model has fewer examples to learn from there
admin.informe.n=Pieces in the dataset
admin.informe.vivo_base=of {0} quotes
admin.informe.proy_titulo_plataforma=Projection from platform activity
admin.informe.proy_titulo_simulacion=Projection on the simulated history
admin.informe.g_correlacion_nota=Mass (kg) appears here only for reference: the model does not train on it.
admin.informe.qv.paises.muestra=The fossil CO₂ each of the highest-emitting countries released in one year. The globe above highlights the same countries: the more amber the dot, the more it emits.
admin.informe.qv.paises.origen=Our World in Data, with Global Carbon Budget data. It is external context: it has nothing to do with glass or SmartGlass.
admin.informe.qv.paises.leer=It gives a sense of scale. Figures are in megatonnes (1 Mt = one billion kg); the CO₂ of a glass piece is counted in kilograms.
admin.informe.qv.vivo.muestra=How many quotes and orders SmartGlass has and how much estimated CO₂ they add up to. The chart spreads that CO₂ by day over the last 7, 30 or 90 days, whichever period you pick.
admin.informe.qv.vivo.origen=Quotes and orders stored in the platform. The quote tool calculates each quote's CO₂ with its formulas; it does not come from the predictive model.
admin.informe.qv.vivo.leer="7 days" counts back from today. A tall bar is a day with more pieces or larger pieces, not an alert. Figures refresh by themselves every 30 seconds, except in photosensitive mode.
admin.informe.qv.proy_plataforma.muestra=How much estimated CO₂ the quotes of the coming days would add up to if the current pace continues. The solid line is what already happened; the dashed one, what is expected; the band, the likely range.
admin.informe.qv.proy_plataforma.origen=The platform's daily activity, fitted with a trend and the weekly cycle (and the yearly one when there are two years of history). It is a projection, not a target or a measurement.
admin.informe.qv.proy_plataforma.leer=Each button adds up from today to that point: that is why figures grow from one week to one year. The further out, the wider the range, because uncertainty builds up. Only the horizons the history allows are shown: it never projects further than the days already recorded.
admin.informe.qv.proy_simulacion.muestra=The same as the platform projection, but on 5 years of simulated history. It shows how the method behaves when there is a lot of history.
admin.informe.qv.proy_simulacion.origen=A daily history generated from the pieces in the synthetic dataset, projected with the same method. Dates are illustrative: the history ends today.
admin.informe.qv.proy_simulacion.leer=Below the chart is the test: the last 6 months were hidden, projected and compared with the simulation. If the error is lower than "repeat last year", the method adds value.
admin.informe.qv.metricas.muestra=How well the model predicts the CO₂ of pieces it did not see during training.
admin.informe.qv.metricas.origen=A part of the synthetic dataset set aside before training. CV R² repeats the test 5 times with other splits.
admin.informe.qv.metricas.leer=R² close to 1 = the model explains almost all the variation in CO₂ (it does not mean it is right that share of the time). MAE = how many kg it is off on average; RMSE weighs large errors more. A small ± in CV = stable results.
admin.informe.qv.referencia.muestra=The Random Forest against two simple models: one that always answers the average, and a linear regression.
admin.informe.qv.referencia.origen=The same test pieces for the three models.
admin.informe.qv.referencia.leer=MAE and RMSE: lower is better. R²: higher is better. A negative R² is worse than always answering the average. The Random Forest beats both, which is why it is the one used.
admin.informe.qv.tipos.muestra=How many pieces of each glass type are in the dataset the model learned from.
admin.informe.qv.tipos.origen=The synthetic dataset of 10,000 pieces, generated with published emission factors.
admin.informe.qv.tipos.leer=The types at the bottom have few pieces: the model has fewer examples of them, so it makes larger errors on those types.
admin.informe.qv.co2_tipo.muestra=The average CO₂ of one piece of each type.
admin.informe.qv.co2_tipo.origen=Calculated in the synthetic dataset with emission factors for the material, the energy and each process.
admin.informe.qv.co2_tipo.leer=Types with more processes or layers (photovoltaic, smart, armoured) are at the top. It is an average: the size and thickness of each piece matter more than the type.
admin.informe.qv.correlacion.muestra=How much two variables move together, on a scale from −1 to 1.
admin.informe.qv.correlacion.origen=The pieces in the synthetic dataset.
admin.informe.qv.correlacion.leer=Amber: they rise together. Blue: when one rises, the other falls. Grey: they are barely related. Mass (kg) shows up here, but the model does not use it: CO₂ comes almost directly from it and the model would have cheated.
admin.informe.qv.real_pred.muestra=Each dot is a test piece: on the horizontal axis, the CO₂ calculated in the dataset; on the vertical one, what the model predicted.
admin.informe.qv.real_pred.origen=The test pieces from the synthetic dataset and the Random Forest predictions.
admin.informe.qv.real_pred.leer=On the amber line the prediction is exact. The tighter the dots around it, the better; the ones far from it are the large errors.
admin.informe.qv.errores.muestra=How many pieces had each size of error: the difference between predicted and calculated, in kg.
admin.informe.qv.errores.origen=The test pieces and the model predictions.
admin.informe.qv.errores.leer=Centred on zero = the model does not tend to overshoot or undershoot. The tails on each side are the few cases with large errors.
admin.informe.qv.importancia.muestra=How much each variable weighs in the model's predictions.
admin.informe.qv.importancia.origen=The importance the Random Forest calculates itself: how much each variable helps separate the pieces in its trees.
admin.informe.qv.importancia.leer=Area, thickness and energy explain almost everything: more glass and more processing, more CO₂. It is the model's overall importance; it does not explain why one specific piece got its result.
admin.informe.qv.real_pred_tipo.muestra=Average CO₂ by glass type: the one calculated in the dataset (amber) and the one the model predicts (blue).
admin.informe.qv.real_pred_tipo.origen=The test pieces grouped by type.
admin.informe.qv.real_pred_tipo.leer=Where the two bars split apart, the model makes larger errors. Types marked (n=…) have few pieces in the dataset: the gap comes from a lack of examples, not from a calculation error.
admin.res.vs_mes_cerrado={0} (closed month) compared with the month before
