superadmin.mercado_t=Market study
superadmin.mercado_sub=How other glass shop systems package their features, and what matters for small businesses.
superadmin.m1=Smart Glazier: Starter (49 USD/month) only quotes and designs in 3D; Essentials (149 USD) adds supplier pricing, production outputs and ordering; Business (249 USD) adds customers, scheduling, automation, accounting and reporting.
superadmin.m2=eDirectGlass: Essential (89,95 USD per user per month) covers invoicing, pricing and SMS; Premium and Premium Plus (119,95 and 149,95 USD) add CRM, customer portal, web quoting, statistics and multiple locations.
superadmin.m3=GlassGo: free up to 5 quotes per month and from 29 USD per month; shares quotes by PDF, email or WhatsApp and is available in Spanish and Portuguese.
superadmin.m4=Micro-businesses in Colombia (DANE, EMICRON 2024, unweighted microdata counts): 67,3 % keep no accounting records and 27,2 % use a notebook or Excel.
superadmin.m5=SMEs in Colombia: 63 % of medium-sized companies show advanced digital adoption versus 42 % of micro-enterprises (Asuntos Legales, 2026; the article does not cite its primary source).
superadmin.conclusion_t=Conclusion
superadmin.conclusion=The market separates an entry plan that quotes and sells from higher tiers with management, documentation, marketing and languages. For a small or less structured shop the value is a frictionless start: catalogue, configurator and quotes with approval. Whatever needs logistics or an organised operation stays in Advanced.
superadmin.recomendaciones_t=Suggested next steps
superadmin.r1=Share quotes over WhatsApp, the main channel of small businesses.
superadmin.r2=Export quotes and orders to Excel or CSV for those who already keep their books that way.
superadmin.r3=A monthly quote limit on Basic, like GlassGo’s free plan.
superadmin.fuentes=Sources
superadmin.nota_precios=Prices in US dollars taken from each vendor’s public pages in October 2026; they may change.

