acerca2.eyebrow=About SmartGlass
acerca2.cta_catalogo=Browse catalogue
acerca2.vision_2=We connect designers and architects directly with the production line: every piece reaches the plant with its dimensions, composition and footprint already calculated.
acerca2.cifras_t=The platform in numbers
acerca2.cifras_sub=Pieces and orders recorded in SmartGlass. Updated every few minutes.
acerca2.c_obras=Pieces quoted
acerca2.c_pedidos=Orders placed
acerca2.c_reciclado=Pieces with recycled material
acerca2.c_calcin=Recycled glass (cullet) in the pieces
acerca2.c_retoma=Old glass booked for take-back
acerca2.c_oro=Pieces with a Gold Green commitment seal
acerca2.metodo_t=How we calculate the footprint
acerca2.metodo_sub=Each piece's footprint is the sum of its stages, from the float glass plant to the site. Every factor has a source.
acerca2.m1_t=Weight of the piece
acerca2.m1_d=Area × thickness × density: 2.5 for monolithic glass, 2.6 for laminated and 2.0 for insulated.
acerca2.m2_t=Float glass melting
acerca2.m2_d=Each kg of float glass emits 1.03 kg CO₂e cradle to gate: the European average according to the AGC and Guardian EPDs (about 10.3 kg per m² at 4 mm), with the sector’s usual 26 % cullet.
acerca2.m3_t=Cullet
acerca2.m3_d=The recycled material option adds 15 % cullet to the batch. Every 10 points of cullet cut furnace emissions by 5 % (FEVE): melting emits 7.5 % less.
acerca2.m4_t=Tempering and laminating
acerca2.m4_d=Tempering uses about 0.8 kWh per m² and mm of thickness, with the Colombian grid at 0.220 kg CO₂e/kWh (UPME, 2024) or solar and wind at 0.03. Each 0.76 mm PVB interlayer adds 3.6 kg CO₂e per m².
acerca2.m5_t=Process level
acerca2.m5_d=Intensity per m²: up to 12 kg is favourable, up to 20 moderate and above 20 high. Thickness weighs the most.
acerca2.m_nota=The configurator, each project page and the environmental sheet use these same rules. Projects saved before October 2026 keep the footprint they were quoted with.
acerca2.p1_d=14 shapes and freehand cuts with up to 64 vertices. If you draw your piece, you pay for its actual area.
acerca2.p2_d=Every piece shows its CO₂, intensity and composition, and has a printable environmental sheet.
acerca2.p3_d=Cullet in the mix, take-back of the glass you replace and cutting from sheet offcuts.
acerca2.comp_t=Your choices count
acerca2.comp_d=For every piece you decide how it is made and delivered. Your choices show in its footprint and in your Green commitment seal.
acerca2.comp_1_t=Material and process
acerca2.comp_1_d=Recycled cullet and renewable energy reduce the piece footprint.
acerca2.comp_2_t=No-cost commitments
acerca2.comp_2_d=Take-back, reusable packaging, consolidated delivery and offcuts: less waste and fewer trips at no extra cost.
acerca2.comp_3_t=Offset
acerca2.comp_3_d=You can offset the footprint of the piece or of the whole order at checkout.
