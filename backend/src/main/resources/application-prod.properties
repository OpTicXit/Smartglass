# =========================================================
# T6 · Perfil de produccion (Render o Railway).
# Se activa con la variable SPRING_PROFILES_ACTIVE=prod y se suma a application.properties.
# Ningun secreto vive aqui: todo llega por variables de entorno (ver DESPLIEGUE.md).
# =========================================================

# Detras del proxy HTTPS de la plataforma: Tomcat toma esquema, host e IP real de X-Forwarded-*.
# Asi {baseUrl} del login con Google sale en https://<dominio> y el limite por IP ve al cliente real.
server.forward-headers-strategy=native

# La cookie de sesion solo viaja por HTTPS
server.servlet.session.cookie.secure=true

# Errores sin detalles internos para el visitante (el detalle queda en el log)
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Logs sobrios: sin SQL en consola ni trazas de seguridad en DEBUG
spring.jpa.show-sql=false
logging.level.root=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.security.oauth2=WARN
logging.level.org.hibernate.SQL=WARN

# Bases gestionadas de capa gratuita aceptan pocas conexiones simultaneas
spring.datasource.hikari.maximum-pool-size=${DB_POOL:5}
spring.datasource.hikari.connection-timeout=10000

# Plantillas y estaticos en cache (sin devtools en el JAR)
spring.thymeleaf.cache=true
spring.web.resources.cache.period=7d
# Versionado por contenido: @{/css/theme.css} sale como /css/theme-<hash>.css, asi un despliegue
# nuevo nunca deja CSS o JS viejos en la cache de 7 dias del navegador
spring.web.resources.chain.strategy.content.enabled=true
# U2: EstaticosWebConfig lee "enabled" y versiona css, js y vendor completos (lo mismo que esta lista); /img usa el mismo periodo
spring.web.resources.chain.strategy.content.paths=/css/**,/js/**,/vendor/**
