<!DOCTYPE html>
<!-- Pagina de error unica (BasicErrorController la usa para cualquier codigo: 400, 401, 403, 404, 405, 413, 429, 500, 503...).
     Texto por codigo en messages*.properties (errorpag.<codigo>.*) y, si no hay, el del grupo (errorpag.4xx / errorpag.5xx). -->
<html lang="es" th:lang="${#locale.toLanguageTag()}" xmlns:th="http://www.thymeleaf.org"
      th:with="s=${status == null or status == 999 ? 500 : status}, grupo=${status == null or status >= 500 ? '5xx' : '4xx'},
               titulo=${#messages.msgOrNull('errorpag.' + s + '.titulo') ?: #messages.msg('errorpag.' + grupo + '.titulo')},
               texto=${#messages.msgOrNull('errorpag.' + s + '.texto') ?: #messages.msg('errorpag.' + grupo + '.texto')},
               reintentar=${s >= 500 or s == 408 or s == 429}">
<head>
    <meta charset="UTF-8">
    <title th:text="${titulo} + ' - SmartGlass'">Error - SmartGlass</title>
    <meta name="robots" content="noindex">
    <th:block th:replace="~{fragments/recursos :: recursos}"></th:block>
    <style>
        .pagina-error {
            position: relative; display: grid; place-content: center; justify-items: center;
            min-height: calc(100vh - 200px); min-height: calc(100dvh - 200px); max-width: 560px; margin: 0 auto; padding: 48px 24px; text-align: center;
        }
        .pagina-error::before {
            content: ""; position: absolute; top: 50%; left: 50%; width: 520px; height: 520px; max-width: 100%;
            transform: translate(-50%, -55%); pointer-events: none;
            background: radial-gradient(circle, var(--color-accent-dim) 0%, transparent 65%);
        }
        .pagina-error > * { position: relative; }
        .pagina-error .codigo {
            margin: 0 0 8px; font-family: var(--font-display); font-size: clamp(5.5rem, 20vw, 9rem); font-weight: 800;
            line-height: 1; letter-spacing: -0.06em; color: transparent;
            background: linear-gradient(180deg, var(--color-accent) 0%, color-mix(in srgb, var(--color-accent) 22%, transparent) 100%);
            -webkit-background-clip: text; background-clip: text;
        }
        /* Fallos del servidor: el degradado pasa al color de aviso para distinguirlos de los errores del visitante */
        .pagina-error.es-5xx .codigo {
            background-image: linear-gradient(180deg, var(--color-warning) 0%, color-mix(in srgb, var(--color-warning) 22%, transparent) 100%);
        }
        .pagina-error h1 { margin: 0 0 12px; font-size: clamp(1.5rem, 4vw, 2rem); }
        .pagina-error p { max-width: 44ch; margin: 0; color: var(--text-muted); }
        .acciones { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 28px; }
    </style>
</head>
<body>

<nav th:replace="~{fragments/navbar-publico :: navbar-publico}"></nav>

<main class="pagina-error" th:classappend="'es-' + ${grupo}" id="contenido">
    <p class="codigo" aria-hidden="true" th:text="${s}">404</p>
    <h1 th:text="${titulo}">No encontramos esta página</h1>
    <p th:text="${texto}">La dirección no existe o cambió.</p>

    <div class="acciones">
        <a th:if="${s == 401}" th:href="@{/login}" class="btn btn-primary" th:text="#{errorpag.iniciar_sesion}">Iniciar sesión</a>
        <!-- solo rutas internas: "//otro-sitio" seria una URL externa -->
        <a th:if="${reintentar and s != 401}"
           th:href="${path != null and #strings.startsWith(path, '/') and !#strings.startsWith(path, '//') and !#strings.startsWith(path, '/error') ? path : '/home'}"
           class="btn btn-primary" th:text="#{errorpag.reintentar}">Reintentar</a>
        <a th:unless="${reintentar or s == 401}" th:href="@{/catalogo}" class="btn btn-primary" th:text="#{errorpag.volver_al_catalogo}">Volver al catálogo</a>
        <a th:href="@{/home}" class="btn btn-secondary" th:text="#{errorpag.ir_al_inicio}">Ir al inicio</a>
    </div>
</main>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
